function jumpTo(id){
  const el=document.getElementById(id);
  if(!el){toast('해당 섹션이 없습니다','err');return;}
  const header=document.querySelector('.header');
  const navWrap=document.getElementById('navWrap');
  const dateBar=document.getElementById('stickyDateBar');
  const headerH=header?header.offsetHeight:0;
  const navH=(navWrap&&navWrap.style.display!=='none')?navWrap.offsetHeight:0;
  const dateH=(dateBar&&dateBar.style.display!=='none')?dateBar.offsetHeight:0;
  const offset=headerH+navH+dateH+16;
  const top=el.getBoundingClientRect().top+window.pageYOffset-offset;
  window.scrollTo({top,behavior:'smooth'});
}
function updateStickyBarTop(){
  const header=document.querySelector('.header');
  const navWrap=document.getElementById('navWrap');
  const dateBar=document.getElementById('stickyDateBar');
  const headerH=header?header.offsetHeight:0;
  if(navWrap) navWrap.style.top=headerH+'px';
  // navWrap의 실제 전체 높이(펼침/접힘 상태 모두 반영)만큼 dateBar를 그 아래로
  const navVisible=navWrap&&navWrap.style.display!=='none';
  const navH=navVisible?navWrap.offsetHeight:0;
  if(dateBar) dateBar.style.top=(headerH+navH)+'px';
}
let _navExpandCollapsed=false;
function toggleNavExpand(){
  const body=document.getElementById('navExpandBody');
  const arr=document.getElementById('navExpandArr');
  const dateBar=document.getElementById('stickyDateBar');
  if(!body)return;
  const collapsed=body.classList.toggle('collapsed');
  _navExpandCollapsed=collapsed;
  if(arr) arr.style.transform=collapsed?'rotate(-90deg)':'rotate(0deg)';
  if(dateBar) dateBar.style.display=collapsed?'none':'block';
  updateStickyBarTop();
  setTimeout(updateStickyBarTop,80);
  setTimeout(updateStickyBarTop,200);
  setTimeout(updateStickyBarTop,400);
}
function applyNavExpandState(){
  const body=document.getElementById('navExpandBody');
  const arr=document.getElementById('navExpandArr');
  const dateBar=document.getElementById('stickyDateBar');
  if(!body)return;
  if(_navExpandCollapsed){
    body.classList.add('collapsed');
    if(arr) arr.style.transform='rotate(-90deg)';
    if(dateBar) dateBar.style.display='none';
  }else{
    body.classList.remove('collapsed');
    if(arr) arr.style.transform='rotate(0deg)';
    if(dateBar&&dateBar.dataset.navActive==='1') dateBar.style.display='block';
  }
}
function updateNavSummary(){
  const el=document.getElementById('navSummaryText');
  if(!el)return;
  el.textContent=(typeof getFilterLabel==='function')?getFilterLabel():'전체';
}

function _promoGetTeams(bu){if(!_PR||!_PR[bu]||Array.isArray(_PR[bu]))return[];const all=Object.keys(_PR[bu]).filter(k=>k!=='전체');if(!SESSION)return all;const role=SESSION.role;if(role==='center'||role==='관리자모드'||role==='bm2'||role==='bm3')return all;const myTeamMap={'bm2_2':'BM2-2팀','bm2_3':'BM2-3팀','bm3_2':'BM3-2팀'};const myTeam=myTeamMap[role]||'';if(myTeam)return all.filter(t=>t===myTeam);return all;}
function initPromoTab(){const area=document.getElementById('promoInner');if(!area)return;_PR=null;_PRbu=null;_PRteam=null;_PRpromo=null;area.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sub);"><div style="width:28px;height:28px;border:3px solid var(--border);border-top-color:#3949ab;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;"></div>불러오는 중...</div>';fetch('promo-registry.json?t='+Date.now()).then(r=>r.json()).then(reg=>{_PR=reg;_promoRender();}).catch(e=>{console.error('promo-registry.json 로드 실패:',e);_PR={};_promoRender();});}
function _promoRender(){const area=document.getElementById('promoInner');if(!area)return;const vis=_promoGetBUs();if(!_PRbu||!vis.includes(_PRbu))_PRbu=vis[0];const buTabs=vis.map(bu=>{const on=bu===_PRbu;return'<button onclick="_promoBUSW(\''+bu+'\')" style="padding:10px 20px;font-size:13px;font-weight:'+(on?700:400)+';border:none;background:none;cursor:pointer;color:'+(on?'#3949ab':'var(--text-sub)')+';border-bottom:3px solid '+(on?'#3949ab':'transparent')+';">'+(_BU_LBL[bu]||bu)+'</button>';}).join('');const data=_PR&&_PR[_PRbu];const isList=Array.isArray(data);const teams=isList?[]:['전체',..._promoGetTeams(_PRbu)].filter(k=>data&&data[k]!==undefined);if(!_PRteam||!teams.includes(_PRteam))_PRteam=teams[0]||'전체';let teamTabs='';if(!isList&&teams.length>1){teamTabs='<div style="background:var(--surface2);border-bottom:1px solid var(--border);padding:4px 16px;display:flex;gap:4px;">'+teams.map(k=>{const on=k===_PRteam;return'<button onclick="_promoTeamSW(\''+k+'\')" style="padding:5px 14px;font-size:12px;font-weight:600;border:none;border-radius:20px;cursor:pointer;background:'+(on?'#3949ab':'none')+';color:'+(on?'#fff':'var(--text-sub)')+';">'+(k==='전체'?'📋 전체':k)+'</button>';}).join('')+'</div>';}const list=isList?data:(data&&data[_PRteam])||[];const ai=list.findIndex(p=>p.active);if(!_PRpromo||!list.find(p=>p.id===_PRpromo.id))_PRpromo=list[ai>=0?ai:0]||null;let roundBar='<div style="background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;">';if(list.length){const hasActive=list.some(p=>p.active);roundBar+='<span style="font-size:12px;color:var(--text-sub);font-weight:600;">회차 선택</span><select onchange="_promoRoundSW(this.value)" style="padding:5px 10px;border-radius:8px;font-size:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);outline:none;">';list.forEach(p=>{roundBar+=`<option value="${p.id}"${_PRpromo&&_PRpromo.id===p.id?' selected':''}>${p.active?'● ':'○ '}${p.label}</option>`;});roundBar+='</select>';if(hasActive)roundBar+='<span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:50px;background:rgba(46,125,50,.15);color:#2e7d32;border:1px solid #388e3c;">● 진행 중</span>';}else{roundBar+='<span style="font-size:12px;color:var(--text-muted);">등록된 프로모션 없음</span>';}roundBar+='</div>';area.innerHTML='<div style="border-bottom:2px solid var(--border);">'+buTabs+'</div>'+teamTabs+roundBar+'<div id="promoContent" style="min-height:400px;"></div>';if(_PRpromo)_promoLoad(_PRpromo);else{const pc=document.getElementById('promoContent');if(pc)pc.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-sub);">📭 등록된 프로모션이 없습니다.</div>';}}
function _promoBUSW(bu){_PRbu=bu;_PRteam=null;_PRpromo=null;_promoRender();}
function _promoTeamSW(team){_PRteam=team;_PRpromo=null;_promoRender();}
function _promoRoundSW(id){const data=_PR&&_PR[_PRbu];const list=Array.isArray(data)?data:(data&&_PRteam?data[_PRteam]:[]);const p=(list||[]).find(x=>x.id===id);if(p){_PRpromo=p;_promoLoad(p);}}
function _promoLoad(promo){const el=document.getElementById('promoContent');if(!el)return;el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sub);"><div style="width:28px;height:28px;border:3px solid var(--border);border-top-color:#3949ab;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;"></div>불러오는 중...</div>';fetch(promo.file+'?t='+Date.now()).then(r=>{if(!r.ok)throw new Error('파일을 불러올 수 없습니다 ('+r.status+')');return r.text();}).then(html=>{el.innerHTML='';const iframe=document.createElement('iframe');iframe.style.cssText='width:100%;border:none;display:block;min-height:200px;';iframe.scrolling='no';el.appendChild(iframe);iframe.srcdoc=html;iframe.addEventListener('load',function(){try{const body=iframe.contentDocument.body;iframe.style.height=(body.scrollHeight+40)+'px';const ro=new ResizeObserver(function(){try{iframe.style.height=(iframe.contentDocument.body.scrollHeight+40)+'px';}catch(e){}});ro.observe(body);}catch(e){iframe.style.height='800px';}});}).catch(e=>{el.innerHTML='<div style="text-align:center;padding:60px;color:#c62828;">❌ '+e.message+'</div>';});}
</script>
</body>
