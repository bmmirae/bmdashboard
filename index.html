<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>미래아이엔씨 가망건 통합 대시보드 v5.101</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f5f7ff;--border:#e8eaf6;
  --text:#333;--text-sub:#777;--text-muted:#aaa;
  --header-bg:linear-gradient(135deg,#0B13E7,#080ead);
  --card-shadow:0 2px 10px rgba(0,0,0,.07);
  --th-bg:#e8eaf6;--th-color:#555;--td-border:#f0f0f0;
  --rank1:#fff9c4;--rank2:#f1f8e9;--rank3:#e8f4fd;
  --badge-bg:rgba(255,255,255,.15);
  --toggle-bg:#ccc;--overlay-bg:rgba(0,0,0,.5);
}
[data-theme="dark"]{
  --bg:#0d1117;--surface:#161b22;--surface2:#1f2937;--border:#30363d;
  --text:#e6edf3;--text-sub:#8b949e;--text-muted:#484f58;
  --header-bg:linear-gradient(135deg,#0a0f6b,#04075c);
  --card-shadow:0 2px 14px rgba(0,0,0,.4);
  --th-bg:#1f2937;--th-color:#8b949e;--td-border:#30363d;
  --rank1:#3a3510;--rank2:#143014;--rank3:#102240;
  --badge-bg:rgba(255,255,255,.08);
  --toggle-bg:#4a6cf7;--overlay-bg:rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--header-bg);}
.login-box{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
[data-theme="dark"] .login-box{background:#161b22;border:1px solid #30363d;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo h2{font-size:22px;font-weight:700;color:#1a237e;margin-top:8px;}
[data-theme="dark"] .login-logo h2{color:#90caf9;}
.login-logo p{font-size:13px;color:#888;margin-top:4px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:6px;}
.login-field select,.login-field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface);color:var(--text);outline:none;transition:border .2s;}
.login-field select:focus,.login-field input:focus{border-color:#3949ab;}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:filter .2s;}
.login-btn:hover{filter:brightness(1.1);}
.login-btn:disabled{background:#ccc;cursor:not-allowed;}
.login-error{background:#fce4ec;color:#c62828;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;display:none;}
.login-error.show{display:block;}
.header{background:var(--header-bg);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;}
.header-left h1{font-size:18px;font-weight:700;}
.header-left .scope{font-size:12px;opacity:.75;margin-top:3px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.user-chip{background:var(--badge-bg);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.2);}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:background .2s;}
.logout-btn:hover{background:rgba(255,255,255,.2);}
.theme-btn{background:var(--badge-bg);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;}
.container{max-width:1700px;margin:0 auto;padding:20px 32px;}
@media(min-width:1101px){.container{padding-right:96px;}}
.jump-fab{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;}

.jump-fab-item{width:56px;height:56px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .15s;border:none;color:#fff;font-size:9px;font-weight:700;line-height:1.25;text-align:center;padding:3px;position:relative;}
.jump-fab-item.fab-popup::after{content:'↗';position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#fff;color:#333;border-radius:50%;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.fab-popup-group{background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.5);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:8px;}
.nav-summary-bar{background:var(--surface);padding:10px 16px;border-radius:12px 12px 0 0;box-shadow:var(--card-shadow);cursor:pointer;display:flex;align-items:center;transition:background .15s;}
.nav-summary-bar:hover{background:var(--surface2);}
#sidePanel{transform:translateX(100%);transition:transform .25s ease;}
#sidePanel.open{transform:translateX(0);}
@keyframes fabBlink{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.15),0 0 0 0 rgba(198,40,40,.6);}50%{box-shadow:0 2px 8px rgba(0,0,0,.15),0 0 0 8px rgba(198,40,40,0);}}
@keyframes cardBlink{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.5);}50%{box-shadow:0 0 0 6px rgba(198,40,40,0);}}
.rt-no-budget{animation:cardBlink 1.6s ease-in-out infinite;}
#fabCheck.blink{animation:fabBlink 1.6s ease-in-out infinite;}
.jump-fab-item:hover{transform:translateX(-4px) scale(1.05);}
.jump-fab-item span.emoji{font-size:16px;margin-bottom:1px;}
@media(max-width:1100px){.jump-fab{display:none;}}
.nav-wrap{background:var(--surface);border-radius:12px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--card-shadow);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.nav-lbl{font-size:12px;color:var(--text-sub);font-weight:600;margin-right:4px;}
.nbtn{padding:6px 14px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-sub);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500;}
.nbtn:hover{border-color:#3949ab;color:#3949ab;}
.nbtn.na{background:#3949ab;color:#fff;border-color:#3949ab;}
.nbtn.na-bm2{background:#1565c0;color:#fff;border-color:#1565c0;}
.nbtn.na-bm3{background:#6a1b9a;color:#fff;border-color:#6a1b9a;}
.nbtn.na-team{background:#00695c;color:#fff;border-color:#00695c;}
.nbtn.na-member{background:#e65100;color:#fff;border-color:#e65100;}
.nbtn.mbr-bm2{background:#e3f2fd;color:#1565c0;border-color:#90caf9;}
.nbtn.mbr-bm2:hover{background:#1565c0;color:#fff;border-color:#1565c0;}
.nbtn.mbr-bm3{background:#f3e5f5;color:#7b1fa2;border-color:#ce93d8;}
.nbtn.mbr-bm3:hover{background:#7b1fa2;color:#fff;border-color:#7b1fa2;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;}
.card{background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:var(--card-shadow);}
.card-lbl{font-size:11px;color:var(--text-sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.card-val{font-size:26px;font-weight:700;}
.cv-blue{color:#3949ab;}.cv-green{color:#2e7d32;}.cv-orange{color:#e65100;}
.cv-purple{color:#6a1b9a;}.cv-red{color:#c62828;}.cv-teal{color:#00695c;}
.card-sub{font-size:11px;color:var(--text-muted);margin-top:3px;}
.pbar{background:var(--border);border-radius:4px;height:5px;margin-top:8px;overflow:hidden;}
.pb{height:100%;border-radius:4px;transition:width .6s;}
.pb-b{background:linear-gradient(90deg,#3949ab,#42a5f5);}
.pb-g{background:linear-gradient(90deg,#2e7d32,#66bb6a);}
.pb-o{background:linear-gradient(90deg,#e65100,#ffa726);}
.pb-p{background:linear-gradient(90deg,#6a1b9a,#ab47bc);}
.pb-t{background:linear-gradient(90deg,#00695c,#26a69a);}
.sec{background:var(--surface);border-radius:12px;padding:18px 20px;box-shadow:var(--card-shadow);margin-bottom:14px;}
.sec-hd{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.sh-b{color:#3949ab;}.sh-g{color:#2e7d32;}.sh-o{color:#e65100;}
.sh-p{color:#6a1b9a;}.sh-r{color:#c62828;}.sh-t{color:#00695c;}
.chd{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:14px;user-select:none;}
.carr{font-size:12px;color:var(--text-sub);transition:transform .3s;}
.cbody{overflow:hidden;transition:max-height .35s,opacity .3s;max-height:6000px;opacity:1;}
.cbody.col,.cbody.collapsed{max-height:0!important;opacity:0;}
.grade-badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;}
.gb-none{background:#f5f5f5;color:#757575;}
.gb-recall{background:#e3f2fd;color:#1565c0;}
.gb-short{background:#fff3e0;color:#e65100;}
.gb-long{background:#fce4ec;color:#c62828;}
.gb-open{background:#f3e5f5;color:#6a1b9a;}
.gb-briefing{background:#e8eaf6;color:#3949ab;}
.gb-done{background:#e8f5e9;color:#2e7d32;}
[data-theme="dark"] .gb-none{background:#2a2a2a;color:#9e9e9e;}
[data-theme="dark"] .gb-recall{background:#0d2b6b;color:#90caf9;}
[data-theme="dark"] .gb-short{background:#2a1500;color:#ffb74d;}
[data-theme="dark"] .gb-long{background:#2a0a0a;color:#ef9a9a;}
[data-theme="dark"] .gb-open{background:#2a0a4a;color:#ce93d8;}
[data-theme="dark"] .gb-briefing{background:#1a1f4a;color:#9fa8da;}
[data-theme="dark"] .gb-done{background:#143014;color:#81c784;}
.bu-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;}
.bb-bm2{background:#e3f2fd;color:#1565c0;}
.bb-bm3{background:#f3e5f5;color:#6a1b9a;}
[data-theme="dark"] .bb-bm2{background:#0d2b6b;color:#90caf9;}
[data-theme="dark"] .bb-bm3{background:#2a0a4a;color:#ce93d8;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--th-bg);color:var(--th-color);padding:9px 10px;text-align:left;font-weight:600;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--td-border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.r1{background:var(--rank1);}tr.r2{background:var(--rank2);}tr.r3{background:var(--rank3);}
tr:hover td{background:var(--surface2);}
.tbl-wrap{overflow-x:auto;}
.compare-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;border-top:4px solid #3949ab;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.compare-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1);}
.compare-card.bm2{border-top-color:#1565c0;}
.compare-card.bm3{border-top-color:#6a1b9a;}
.compare-card.team{border-top-color:#00695c;}
.cc-name{font-size:14px;font-weight:700;margin-bottom:10px;}
.cc-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.cc-lbl{color:var(--text-sub);}
.cc-val{font-weight:600;}
.recall-card{background:var(--surface2);border:1px solid var(--border);border-left:4px solid #c62828;border-radius:10px;padding:14px;}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.rc-company{font-size:14px;font-weight:700;color:#3949ab;}
.rc-meta{font-size:11px;color:var(--text-sub);margin-bottom:3px;}
.rc-recalls{background:var(--bg);border-radius:7px;padding:8px 10px;margin-top:6px;font-size:11px;}
.chart-box{position:relative;height:200px;}
.ib-wrap{display:flex;align-items:center;gap:6px;}
.ib{height:7px;border-radius:3px;min-width:2px;}
.cp-row{margin-bottom:7px;}
.cp-lbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;}
.cp-track{background:var(--border);border-radius:3px;height:7px;}
.cp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3949ab,#42a5f5);transition:width .5s;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.fsel,.finput{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;}
.finput{flex:1;min-width:120px;}
.abar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.rbtn{background:var(--surface);border:1px solid var(--border);color:var(--text-sub);padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;}
.dlbtn{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;padding:7px 16px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:600;}
.lov{display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:999;justify-content:center;align-items:center;flex-direction:column;}
.lov.show{display:flex;}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
.ltxt{color:#fff;margin-top:14px;font-size:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spin-cmp{to{transform:rotate(360deg);transform-origin:65px 65px;}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.no-cap{display:none!important;}
@media(max-width:900px){.g4,.g6{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr 1fr;}}
@media(max-width:580px){.g2,.g3,.g4,.g6{grid-template-columns:1fr;}}
.recall-tip{position:relative;display:inline-block;cursor:default;}
.recall-tip .tip-content{display:none;position:fixed;background:#1e2130;color:#e0e4f0;font-size:13px;line-height:1.7;padding:10px 14px;border-radius:8px;white-space:pre-wrap;min-width:200px;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:9999;word-break:keep-all;border:1px solid #2e3250;pointer-events:none;}
.recall-tip:hover .tip-content{display:block;}
.recall-tip .tip-content::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1e2130;}
</style>
</head>
<body>
<div class="lov" id="lov"><div class="spinner"></div><div class="ltxt" id="ltxt">불러오는 중...</div></div>
<div class="toast" id="toast"></div>
<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <img src="ci_logo/CI-png파일.png" alt="CI" style="height:56px;object-fit:contain;">
        <h2>가망건 통합 대시보드</h2>
        <p>권한에 맞는 역할을 선택하고 비밀번호를 입력하세요</p>
      </div>
      <div class="login-field">
        <label>역할 선택</label>
        <select id="roleSelect">
          <option value="">-- 역할 선택 --</option>
          <option value="관리자모드">🔑 관리자모드</option>
          <option value="center">📊 센터장 (박경숙 상무)</option>
          <option value="bm2">🔵 BM2본부장 (이진기)</option>
          <option value="bm3">🟣 BM3본부장 (김윤섭)</option>
          <option value="bm2_2">👥 BM2-2팀장 (김혜윰)</option>
          <option value="bm2_3">👥 BM2-3팀장 (김소현)</option>
          <option value="bm3_2">👥 BM3-2팀장 (안상민)</option>
        </select>
      </div>
      <div class="login-field">
        <label>비밀번호</label>
        <input type="password" id="pwInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>
<!-- 인원 관리 모달 -->
<div id="memberMgmtModal" style="display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;margin:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="font-size:16px;font-weight:700;">⚙️ 인원 관리</h2>
      <button onclick="closeMemberMgmt()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sub);">✕</button>
    </div>
    <div style="background:var(--surface2);border-radius:12px;padding:16px;margin-bottom:16px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:12px;color:#3949ab;">➕ 인원 추가</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">본부</label><select id="addBU" onchange="updateAddTeamOptions()" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"><option value="">본부 선택</option></select></div>
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">팀</label><select id="addTeam" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"><option value="">팀 선택</option></select></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">이름</label><input id="addName" type="text" placeholder="홍길동" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">구글 시트 ID</label><input id="addSheetId" type="text" placeholder="스프레드시트 ID 붙여넣기" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">직급</label><input id="addTitle" type="text" placeholder="예: 대리, 사원" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">입사일</label><input id="addJoinDate" type="text" placeholder="예: 2024-03-15" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>

<script>
// ── Naver Worker URL ──────────────────────────
const NAVER_WORKER_URL = 'https://naver-api.bm1mirae.workers.dev';

// ── 공통 상수 ─────────────────────────────────
const BU_ORDER   = ['BM2본부','BM3본부'];
const TEAM_ORDER = ['BM2-1팀','BM2-2팀','BM2-3팀','BM3-1팀','BM3-2팀'];
const VALID_GRADES = ['단기','장기','권한오픈','권한+브리핑','이관완료'];
const EXCLUDE_GRADES = ['선택없음','단순재콜','희망건','메일전송',''];

let SESSION = null;
let CURRENT_ROWS = [];
let CURRENT_FILTER = 'all';
let MEMBER_NAV_ACTIVATED = false;
let RECENT_GRADE_CHANGES = [];
let DATE_FROM = '';
let DATE_TO   = '';
let chartGrade = null, chartBudget = null;
// 막대 위에 값 표시하는 경량 커스텀 플러그인 (별도 CDN 불필요)
const barValueLabelPlugin = {
  id: 'barValueLabel',
  afterDatasetsDraw(chart) {
    const {ctx} = chart;
    chart.data.datasets.forEach((dataset, dsIndex) => {
      if (dataset.type && dataset.type !== 'bar') return; // bar가 아니면 스킵 (라인 등)
      if (chart.config.type !== 'bar' && !dataset.type) return; // 차트 전체가 bar 타입일 때만
      const meta = chart.getDatasetMeta(dsIndex);
      if (meta.hidden || meta.type !== 'bar') return;
      meta.data.forEach((bar, i) => {
        const val = dataset.data[i];
        if (val === undefined || val === null || val === 0) return;
        ctx.save();
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#333';
        ctx.font = '600 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(val, bar.x, bar.y - 3);
        ctx.restore();
      });
    });
  }
};
Chart.register(barValueLabelPlugin);
const PAGE = 50;
let curPage = 1;

const API_URL = 'https://script.google.com/macros/s/AKfycbwzIzzR-Aj5DZ7lWapTSaA9Fe5V72H53VMpD8WbGyj7KS1crBvmGlQOfNvMO98bfk7s/exec';

function callServer(fnName, params){
  const url = API_URL+'?action='+encodeURIComponent(fnName)+'&params='+encodeURIComponent(JSON.stringify(params||{}));
  return fetch(url).then(r=>r.json()).then(res=>typeof res==='string'?JSON.parse(res):res).catch(e=>({success:false,error:e.message}));
}

function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('dash_theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'☀️ 라이트':'🌙 다크';
}
(function(){
  const s=localStorage.getItem('dash_theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  document.addEventListener('DOMContentLoaded',function(){
    const btn=document.getElementById('themeBtn');
    if(btn) btn.textContent=s==='dark'?'☀️ 라이트':'🌙 다크';
  });
})();

function fmt(v){const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));return isNaN(n)?'-':Math.round(n).toLocaleString('ko-KR');}
function fmtB(v){if(!v||v<=0)return'-';return Math.round(v/10000).toLocaleString('ko-KR')+'만원';}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function normalizeDate(d){if(!d)return'';const s=String(d).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m1=s.match(/^(\d{4})\s*[.\/]\s*(\d{1,2})\s*[.\/]\s*(\d{1,2})\s*$/);if(m1)return`${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;const m2=s.match(/^(\d{2})\s*[.\/]\s*(\d{1,2})\s*[.\/]\s*(\d{1,2})\s*$/);if(m2)return`20${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;return s;}
function fmtDateDisp(d){const n=normalizeDate(d||'');if(!n||n==='-')return'-';const m=n.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return m[1]+'.'+m[2]+'.'+m[3];return n;}
function fmtRecallDate(dateStr){if(!dateStr)return'-';const m=String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return`${m[1].slice(2)}/${parseInt(m[2])}/${parseInt(m[3])}`;return dateStr;}
function gradeBadge(g){const map={'선택없음':'gb-none','단순재콜':'gb-recall','단기':'gb-short','장기':'gb-long','권한오픈':'gb-open','권한+브리핑':'gb-briefing','메일전송':'gb-mail','이관완료':'gb-done'};const c=map[g]||'gb-none';return`<span class="grade-badge ${c}">${g||'선택없음'}</span>`;}
function gradeBadgeEx(g,changed){const map={'선택없음':'gb-none','단순재콜':'gb-recall','단기':'gb-short','장기':'gb-long','권한오픈':'gb-open','권한+브리핑':'gb-briefing','메일전송':'gb-mail','이관완료':'gb-done'};const c=map[g]||'gb-none';const icon=changed?`<span title="최근 등급 변경됨" style="margin-left:3px;font-size:10px;">🔄</span>`:'';return`<span class="grade-badge ${c}">${g||'선택없음'}${icon}</span>`;}
function buBadge(b){return`<span class="bu-badge ${b==='BM2본부'?'bb-bm2':'bb-bm3'}">${b}</span>`;}
function rankIcon(i){return['🥇','🥈','🥉'][i]||(i+1)+'위';}
function rc(i){return['r1','r2','r3'][i]||'';}
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='err'?'#c62828':'#1b5e20';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function loading(show,txt='불러오는 중...'){document.getElementById('ltxt').textContent=txt;document.getElementById('lov').classList.toggle('show',show);}
function toggleC(id){const b=document.getElementById(id),a=document.getElementById(id+'A');const c=b.classList.toggle('collapsed');if(a)a.style.transform=c?'rotate(-90deg)':'rotate(0deg)';if(!c){setTimeout(()=>{if(chartGrade)chartGrade.resize();if(chartBudget)chartBudget.resize();if(typeof _npTrendChart!=='undefined'&&_npTrendChart)_npTrendChart.resize();},260);}}

function renderRecallChips(recalls){
  if(!recalls||!recalls.length)return'<span style="color:var(--text-muted);">-</span>';
  const td2=today();
  const sorted=[...recalls].filter(rc=>{const d=typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'';if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return true;return d<=td2;}).sort((a,b)=>{const da=typeof a==='object'?(a.date||''):normalizeDate(String(a).slice(0,10))||'';const db=typeof b==='object'?(b.date||''):normalizeDate(String(b).slice(0,10))||'';return db.localeCompare(da);});
  const makeChip=rc=>{let dateStr='',memo='';if(typeof rc==='object'&&rc!==null){dateStr=rc.date||'';memo=rc.memo||'';}else{dateStr=String(rc);}const label=fmtRecallDate(dateStr);if(!memo)return`<span style="display:inline-block;font-size:11px;background:var(--surface2);border:0.5px solid var(--border);border-radius:5px;padding:2px 7px;margin:1px 2px;color:var(--text-sub);">${label}</span>`;return`<span class="recall-tip"><span style="display:inline-block;font-size:11px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 8px;margin:1px 2px;color:#1565c0;font-weight:600;cursor:help;">${label} 💬</span><span class="tip-content">${memo.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</span></span>`;};
  if(sorted.length<=5)return sorted.map(makeChip).join('');
  const uid='rc_'+Math.random().toString(36).slice(2,7);
  const first5=sorted.slice(0,5).map(makeChip).join('');
  const rest=sorted.slice(5).map(makeChip).join('');
  const extra=sorted.length-5;
  return`<span>${first5}<span id="rc_more_${uid}"><span onclick="toggleRecallMore('${uid}')" style="display:inline-block;font-size:11px;color:#1565c0;cursor:pointer;font-weight:600;margin-left:2px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 7px;">+${extra} 더보기 ▼</span></span><span id="rc_rest_${uid}" style="display:none;">${rest}<span onclick="toggleRecallMore('${uid}')" style="display:inline-block;font-size:11px;color:#1565c0;cursor:pointer;font-weight:600;margin-left:2px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 7px;">▲ 접기</span></span></span>`;
}
// [v5.100] 전체 가망건 리스트 전용: 첫콜 칩 + 재콜 진행 요약줄 + 기존 재콜칩
function renderRecallChipsFC(r){
  const base=renderRecallChips(r.recalls);
  const fc=normalizeDate(r.firstCall)||'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fc))return base;
  const td2=today();
  const ds=(r.recalls||[]).map(rc=>typeof rc==='object'&&rc?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'').filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=td2&&d>=fc).sort();
  const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
  const esc=t=>String(t||'').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  const memo=(r.content||'').trim();
  const chip=`<span class="recall-tip"><span style="display:inline-block;font-size:11px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:5px;padding:2px 8px;margin:1px 2px;color:#6a1b9a;font-weight:700;cursor:${memo?'help':'default'};">첫콜 ${fmtRecallDate(fc)}${memo?' 💬':''}</span>${memo?`<span class="tip-content">${esc(memo)}</span>`:''}</span>`;
  let sum;
  if(!ds.length){sum=`재콜 없음 · 첫콜 후 ${diff(fc,td2)}일 경과`;}
  else{
    const gaps=[diff(fc,ds[0])];for(let i=1;i<ds.length;i++)gaps.push(diff(ds[i-1],ds[i]));
    const avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10;
    sum=`재콜 ${ds.length}회 · 첫콜→1차 ${gaps[0]}일 · 평균간격 ${avg}일 · 마지막 재콜 후 ${diff(ds[ds.length-1],td2)}일`;
  }
  const sumHtml=`<div style="font-size:10px;color:#6a1b9a;margin:1px 2px 2px;line-height:1.4;">${sum}</div>`;
  const rest=(r.recalls&&r.recalls.length)?base:'';
  return sumHtml+chip+rest;
}
// [v5.101] 첫콜 칩 (체크 가망건 카드용, 표시 전용 / 호버 시 첫콜 내용 전문)
function renderFirstCallChip(r){
  const fc=normalizeDate(r&&r.firstCall)||'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fc))return'';
  const memo=((r&&r.content)||'').trim();
  const esc=t=>String(t||'').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  return`<span class="recall-tip"><span style="display:inline-block;font-size:11px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:5px;padding:2px 8px;margin:1px 2px;color:#6a1b9a;font-weight:700;cursor:${memo?'help':'default'};">첫콜 ${fmtRecallDate(fc)}${memo?' 💬':''}</span>${memo?`<span class="tip-content">${esc(memo)}</span>`:''}</span>`;
}
function toggleRecallMore(uid){const more=document.getElementById('rc_more_'+uid);const rest=document.getElementById('rc_rest_'+uid);if(!more||!rest)return;const h=rest.style.display==='none';more.style.display=h?'none':'inline';rest.style.display=h?'inline':'none';}

// [v5.9] 보관 카드 전용: 보관 처리 시점(sinceDateTime) 이후에 새로 달린 재콜만 주황색으로 강조 표시
function renderRecallChipsMarked(recalls,sinceDateTime){
  if(!recalls||!recalls.length)return'<span style="color:var(--text-muted);">-</span>';
  const sinceDate=sinceDateTime?String(sinceDateTime).slice(0,10):'';
  const td2=today();
  const sorted=[...recalls].filter(rc=>{const d=typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'';if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return true;return d<=td2;}).sort((a,b)=>{const da=typeof a==='object'?(a.date||''):normalizeDate(String(a).slice(0,10))||'';const db=typeof b==='object'?(b.date||''):normalizeDate(String(b).slice(0,10))||'';return db.localeCompare(da);});
  const makeChip=rc=>{
    let dateStr='',memo='';
    if(typeof rc==='object'&&rc!==null){dateStr=rc.date||'';memo=rc.memo||'';}else{dateStr=String(rc);}
    const label=fmtRecallDate(dateStr);
    const d=normalizeDate(dateStr)||'';
    const isNew=!!(sinceDate&&d&&d>sinceDate);
    const bg=isNew?'#fff3e0':(memo?'#e8f4fd':'var(--surface2)');
    const border=isNew?'#ffb74d':(memo?'#90caf9':'var(--border)');
    const color=isNew?'#e65100':(memo?'#1565c0':'var(--text-sub)');
    const weight=(isNew||memo)?'700':'400';
    const badge=isNew?'🆕 ':'';
    const memoIcon=memo?' 💬':'';
    const inner=`<span style="display:inline-block;font-size:11px;background:${bg};border:1px solid ${border};border-radius:5px;padding:2px 8px;margin:1px 2px;color:${color};font-weight:${weight};cursor:${memo?'help':'default'};">${badge}${label}${memoIcon}</span>`;
    if(!memo)return inner;
    return`<span class="recall-tip">${inner}<span class="tip-content">${memo.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</span></span>`;
  };
  if(sorted.length<=5)return sorted.map(makeChip).join('');
  const uid='rcm_'+Math.random().toString(36).slice(2,7);
  const first5=sorted.slice(0,5).map(makeChip).join('');
  const rest=sorted.slice(5).map(makeChip).join('');
  const extra=sorted.length-5;
  return`<span>${first5}<span id="rc_more_${uid}"><span onclick="toggleRecallMore('${uid}')" style="display:inline-block;font-size:11px;color:#1565c0;cursor:pointer;font-weight:600;margin-left:2px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 7px;">+${extra} 더보기 ▼</span></span><span id="rc_rest_${uid}" style="display:none;">${rest}<span onclick="toggleRecallMore('${uid}')" style="display:inline-block;font-size:11px;color:#1565c0;cursor:pointer;font-weight:600;margin-left:2px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 7px;">▲ 접기</span></span></span>`;
}

  area.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;"><select onchange="changePerfMonth(this.value)" style="padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;">${monthOpts}</select><span style="font-size:13px;color:var(--text-sub);">영업일 ${res.totalWorkDaysInMonth}일 기준</span></div><div class="sec"><div class="sec-hd sh-b" style="margin-bottom:12px;">🏆 전사원 매출 현황 (${PERF_YEAR}년 ${PERF_MONTH}월)</div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:var(--th-bg);color:var(--th-color);"><th style="padding:8px 12px;">순위</th><th style="padding:8px 12px;">이름</th><th style="padding:8px 12px;">소속</th><th style="padding:8px 12px;">현재매출</th><th style="padding:8px 12px;">달성률 바</th><th style="padding:8px 12px;">달성률</th></tr></thead><tbody>${rankRows}</tbody></table></div></div>${cards}`;

// ── 통계 계산 ─────────────────────────────────
function calcClientStats(rows){
  const td=today();let filteredByDate=rows;
  if(DATE_FROM||DATE_TO){filteredByDate=rows.filter(r=>{const norm=normalizeDate(r.firstCall)||'';let maxD=norm;if(r.recalls&&r.recalls.length){r.recalls.forEach(rc=>{const d=typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'';if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d>maxD)maxD=d;});}const latestDate=maxD||norm;if(DATE_FROM&&latestDate<DATE_FROM)return false;if(DATE_TO&&latestDate>DATE_TO)return false;return true;});}
  const activeRows=filteredByDate.filter(r=>VALID_GRADES.includes(r.grade));
  const gradeMap={},memberMap={},teamMap={},buMap={};
  const bands={'50만원 미만':{min:0,max:500000,count:0,total:0},'50-100만원':{min:500000,max:1000000,count:0,total:0},'100-300만원':{min:1000000,max:3000000,count:0,total:0},'300-500만원':{min:3000000,max:5000000,count:0,total:0},'500만원 이상':{min:5000000,max:Infinity,count:0,total:0}};
  const bandGroups={};
  const _allNames=Object.values(ORG_MAP).flatMap(bu=>Object.values(bu).flat());
  let _budgetGroupType='bu',_budgetGroupOrder=[];
  if(CURRENT_FILTER==='all'){_budgetGroupType='bu';_budgetGroupOrder=BU_ORDER.slice();}
  else if(_allNames.includes(CURRENT_FILTER)){_budgetGroupType='none';_budgetGroupOrder=[];}
  else if(ORG_MAP[CURRENT_FILTER]){_budgetGroupType='team';_budgetGroupOrder=TEAM_ORDER.filter(t=>t.startsWith(CURRENT_FILTER==='BM2본부'?'BM2':'BM3'));}
  else{_budgetGroupType='member';const bu=TEAM_ORDER.includes(CURRENT_FILTER)?(CURRENT_FILTER.startsWith('BM2')?'BM2본부':'BM3본부'):'';_budgetGroupOrder=(ORG_MAP[bu]&&ORG_MAP[bu][CURRENT_FILTER])?ORG_MAP[bu][CURRENT_FILTER].slice():[];}
  const _budgetGroupKeyFn=r=>{if(_budgetGroupType==='bu')return r.bu;if(_budgetGroupType==='team')return r.team;if(_budgetGroupType==='member')return r.manager;return null;};
  const contactMap={};
  const _mRange=getMonthRange();activeRows.forEach(r=>{const g=r.grade||'미분류';gradeMap[g]=(gradeMap[g]||0)+1;if(!memberMap[r.manager])memberMap[r.manager]={name:r.manager,team:r.team,bu:r.bu,title:r.title||'',joinDate:r.joinDate||'',total:0,grades:{},thisMonthNew:0};memberMap[r.manager].total++;memberMap[r.manager].grades[g]=(memberMap[r.manager].grades[g]||0)+1;{const fc=normalizeDate(r.firstCall)||'';if(fc>=_mRange.start&&fc<=_mRange.end)memberMap[r.manager].thisMonthNew++;}if(!teamMap[r.team])teamMap[r.team]={team:r.team,bu:r.bu,total:0,grades:{}};teamMap[r.team].total++;teamMap[r.team].grades[g]=(teamMap[r.team].grades[g]||0)+1;if(!buMap[r.bu])buMap[r.bu]={bu:r.bu,total:0,grades:{}};buMap[r.bu].total++;buMap[r.bu].grades[g]=(buMap[r.bu].grades[g]||0)+1;if(r.budget>0)for(const b in bands)if(r.budget>=bands[b].min&&r.budget<bands[b].max){bands[b].count++;bands[b].total+=r.budget;const gk=_budgetGroupKeyFn(r);if(gk){if(!bandGroups[b])bandGroups[b]={};bandGroups[b][gk]=(bandGroups[b][gk]||0)+1;}break;}const cp=r.contactPoint||'미분류';if(!contactMap[r.manager])contactMap[r.manager]={name:r.manager,team:r.team,bu:r.bu,points:{}};contactMap[r.manager].points[cp]=(contactMap[r.manager].points[cp]||0)+1;});
  const missedRecalls=rows.filter(r=>r.missedRecallDate&&r.missedRecallDate<td).map(r=>({...r,nextRecallDate:r.missedRecallDate})).sort((a,b)=>(b.nextRecallDate||'').localeCompare(a.nextRecallDate||''));
  const todayRecalls=rows.filter(r=>r.nextRecallDate&&r.nextRecallDate===td);
  const d10=new Date();d10.setDate(d10.getDate()-10);const since10=d10.getFullYear()+'-'+String(d10.getMonth()+1).padStart(2,'0')+'-'+String(d10.getDate()).padStart(2,'0');
  const recentTransfers=rows.filter(r=>r.grade==='이관완료'&&(r.firstCall||'')>=since10).sort((a,b)=>(b.firstCall||'').localeCompare(a.firstCall||''));
  const sortedTeams=TEAM_ORDER.filter(t=>teamMap[t]).map(t=>teamMap[t]);
  const sortedBUs=BU_ORDER.filter(b=>buMap[b]).map(b=>buMap[b]);
  return{total:activeRows.length,totalAll:filteredByDate.length,totalBudget:activeRows.reduce((s,r)=>s+r.budget,0),gradeMap,memberStats:Object.values(memberMap).sort((a,b)=>b.total-a.total),budgetBands:bands,budgetGroups:bandGroups,budgetGroupType:_budgetGroupType,budgetGroupOrder:_budgetGroupOrder,todayRecalls,missedRecalls,recentTransfers,contactStats:Object.values(contactMap),teamStats:sortedTeams,buStats:sortedBUs};
}

let _npPromoOnly=false;

function getNPMonthOptions(rows){
  const activeRows=rows.filter(r=>VALID_GRADES.includes(r.grade));
  const months=new Set();
  activeRows.forEach(r=>{
    const fc=normalizeDate(r.firstCall)||'';
    if(fc.length>=7) months.add(fc.slice(0,7));
  });
  return [...months].sort().reverse();
}

function getNPMonthRange(ym){
  if(!ym){const m=getMonthRange();return m;}
  const[y,mo]=ym.split('-').map(Number);
  const first=new Date(y,mo-1,1);
  const last=new Date(y,mo,0);
  const fmt=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return{start:fmt(first),end:fmt(last)};
}

function isPromoForMonth(r,monthStart,monthEnd){
  const fc=normalizeDate(r.firstCall)||'';
  if(!fc) return false;
  const isInMonth=fc>=monthStart&&fc<=monthEnd;
  if(!isInMonth) return false;
  const PROMO_GRADES=['단기','장기','권한오픈','권한+브리핑'];
  if(PROMO_GRADES.includes(r.grade)&&r.budget>0&&r.advertiserManager&&r.phone&&r.email) return true;
  if(r.grade==='이관완료') return true;
  return false;
}

function switchNPTab(tab){
  ['today','week','month'].forEach(t=>{
    const btn=document.getElementById('npt_'+t);
    const cont=document.getElementById('np_'+t);
    const isActive=t===tab;
    if(btn){btn.style.fontWeight=isActive?'700':'400';btn.style.color=isActive?'#2e7d32':'var(--text-sub)';btn.style.borderBottom=isActive?'3px solid #2e7d32':'3px solid transparent';}
    if(cont)cont.style.display=isActive?'block':'none';
  });
  const now=new Date();const week=getWeekRange();
  const selMonth=_npSelectedMonth;
  const monthLabel=selMonth?(parseInt(selMonth.slice(0,4))+'년 '+parseInt(selMonth.slice(5))+'월'):(now.getFullYear()+'년 '+(now.getMonth()+1)+'월');
  const labels={today:'오늘 '+today(),week:'주간 '+week.start.slice(5).replace('-','/')+' ~ '+week.end.slice(5).replace('-','/'),month:'월간 '+monthLabel};
  const lbl=document.getElementById('npTabLabel');if(lbl)lbl.textContent=labels[tab];
  applyNPPromoFilter();
}

let _transferPeriod='all'; // [v5.13] 이관완료 탭 기간필터 상태(all/1w/1m)
let _checkLogData=[]; // 서버에서 로드한 체크로그

function classifyCheckItem(r){
  const cats=[]; // {cat, reason}
  if(r.grade==='이관완료') return cats; // 이관완료는 CHECK 대상에서 완전 제외
  const isGmg=VALID_GRADES.includes(r.grade);
  const hasRecall=!!(r.recalls&&r.recalls.length);
  if(isGmg){
    if(r.recalls&&r.recalls.length>=5) cats.push({cat:'컨택5회+',reason:'재콜 '+r.recalls.length+'회 진행 중 (5회 이상)'});
    const biz3=getRecentBizDates(3);
    const fc=normalizeDate(r.firstCall)||'';
    if(biz3.has(fc)) cats.push({cat:'신규3일',reason:'첫콜일 '+fc+' (최근 3영업일 이내 신규 등록)'});
    if(hasRecall){
      const dates=r.recalls.map(rc=>typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'').filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
      if(dates.length){
        const latest=dates.sort().reverse()[0];
        const diffDays=Math.floor((new Date(today())-new Date(latest))/86400000);
        if(diffDays>7) cats.push({cat:'컨택정체',reason:'마지막 컨택 '+latest+' 이후 '+diffDays+'일 경과 (7일 초과)'});
      }
    }
  }else{
    if(r.budget>0&&r.advertiserManager&&r.phone&&r.email) cats.push({cat:'비가망P',reason:'가망도 미지정이지만 예산·담당자·연락처·이메일 등록 완료'});
    if(hasRecall){
      const longMemoDates=new Set();
      r.recalls.forEach(rc=>{
        if(typeof rc==='object'&&rc!==null&&rc.memo&&rc.memo.trim().length>=15){
          const d=normalizeDate(rc.date)||'';
          if(d) longMemoDates.add(d);
        }
      });
      if(longMemoDates.size>=3) cats.push({cat:'숨은가망',reason:'재콜 메모 15자 이상 기록이 '+longMemoDates.size+'일 (3일 이상, 비가망건인데 컨택 활발)'});
    }
  }
  return cats;
}

const CHECK_CAT_COLOR={'컨택5회+':'#1565c0','신규3일':'#2e7d32','컨택정체':'#c62828','비가망P':'#7b1fa2','숨은가망':'#e65100'};
const GMG_CATS_GLOBAL=['컨택5회+','신규3일','컨택정체'];

function getCheckKey(r,cat){return r.company+'|||'+r.manager+'|||'+(normalizeDate(r.firstCall)||'')+'|||'+cat;}

function dedupeCheckLog(rows){
  // 업체명+담당자+첫콜날짜+분류가 같으면 가장 최근(actedAt) 것만 남김
  const map=new Map();
  rows.forEach(l=>{
    const key=l.company+'|||'+l.manager+'|||'+l.firstCall+'|||'+l.category;
    const existing=map.get(key);
    if(!existing||(l.actedAt||'')>(existing.actedAt||'')) map.set(key,l);
  });
  return[...map.values()];
}
async function loadCheckLog(){
  if(!SESSION)return;
  try{
    const res=await callServer('serverGetCheckLog',{role:SESSION.role,token:SESSION.token});
    if(res&&res.success) _checkLogData=dedupeCheckLog(res.rows||[]);
  }catch(e){}
}

function renderLongMemoChips(recalls){
  if(!recalls||!recalls.length)return'';
  const longOnes=recalls.filter(rc=>typeof rc==='object'&&rc!==null&&rc.memo&&rc.memo.trim().length>=15);
  if(!longOnes.length)return'';
  return renderRecallChips(longOnes);
}
function getNeedItemsFor(rowsSubset){
  // 같은 업체(company+manager+firstCall)에 여러 조건이 동시 해당하면 하나로 묶어서 반환
  const needMap=new Map();
  rowsSubset.forEach(r=>{
    const fc=normalizeDate(r.firstCall)||'';
    // [v5.9] 업체 단위 보관 처리: 이 업체가 어떤 카테고리로든 한 번 보관되었으면(삭제완료 제외)
    // 이후 등급 변경 등으로 다른 카테고리에 새로 해당되어도 체크필요에 다시 노출하지 않음
    const isArchivedCompany=_checkLogData.some(l=>l.company===r.company&&l.manager===r.manager&&l.firstCall===fc&&l.status==='보관'&&l.deleted!=='Y');
    if(isArchivedCompany) return;
    const cats=classifyCheckItem(r);
    const unlogged=cats.filter(({cat})=>{
      const logEntry=_checkLogData.find(l=>l.company===r.company&&l.manager===r.manager&&l.firstCall===fc&&l.category===cat);
      if(!logEntry||!logEntry.status) return true; // 상태(확인완료/보관)가 비어있으면(본부확인만 있는 행) 여전히 체크필요로 취급
      // [v5.13] 삭제완료(소프트삭제) 처리된 항목은, 삭제 시점 스냅샷 대비 가망도가 바뀌었거나 새 재콜이 생겼으면 재검출
      if(logEntry.deleted==='Y'){
        const gradeChanged=!!(logEntry.deletedGrade&&r.grade&&logEntry.deletedGrade!==r.grade);
        const newRecall=!!(logEntry.deletedLastRecall&&r._latestDate&&r._latestDate>logEntry.deletedLastRecall);
        return gradeChanged||newRecall;
      }
      return false; // 확인완료/보관(삭제 안 된) 상태는 기존과 동일하게 계속 차단
    });
    if(unlogged.length){
      const rowKey=r.company+'|||'+r.manager+'|||'+fc;
      needMap.set(rowKey,{r,cats:unlogged});
    }
  });
  return[...needMap.values()];
}
const HQ_LEVEL_ROLES=['center','관리자모드','master','bm2','bm3'];
// [v5.13] 이관완료 탭 렌더링 — 체크로그와 무관하게 현재 가망도 기준으로 필터링된 항목을 기간별로 보여줌
function renderTransferTab(items){
  if(!items.length) return `<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px;">이관완료 처리된 항목이 없습니다</div>`;
  const today2=today();
  const d1=new Date();d1.setDate(d1.getDate()-7);
  const oneWeekAgo=d1.getFullYear()+'-'+String(d1.getMonth()+1).padStart(2,'0')+'-'+String(d1.getDate()).padStart(2,'0');
  const d2=new Date();d2.setMonth(d2.getMonth()-1);
  const oneMonthAgo=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');

  // 각 항목의 이관완료감지일 조회 — 아직 기록 안 된 항목은 '오늘'로 임시 표시하고 백그라운드로 서버에 최초 기록 요청
  const undetected=[];
  const withDate=items.map(({r,log,fromNeed})=>{
    const fc=normalizeDate(r.firstCall)||'';
    const trackLog=_checkLogData.find(l=>l.company===r.company&&l.manager===r.manager&&l.firstCall===fc&&l.category==='이관완료');
    let detectedAt=trackLog&&trackLog.transferDetectedAt?trackLog.transferDetectedAt:'';
    if(!detectedAt){ detectedAt=today2; undetected.push({company:r.company,manager:r.manager,firstCall:fc}); }
    return {r,log,fromNeed,detectedAt};
  });
  if(undetected.length) _ensureTransferDetected(undetected);

  const filtered=withDate.filter(({detectedAt})=>{
    if(_transferPeriod==='1w') return detectedAt>=oneWeekAgo;
    if(_transferPeriod==='1m') return detectedAt>=oneMonthAgo;
    return true;
  }).sort((a,b)=>(b.detectedAt||'').localeCompare(a.detectedAt||''));

  let h=`<div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
    <label style="font-size:12px;color:var(--text-sub);">기간</label>
    <select id="transferPeriodSel" onchange="onTransferPeriodChange(this.value)" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;">
      <option value="all" ${_transferPeriod==='all'?'selected':''}>전체</option>
      <option value="1w" ${_transferPeriod==='1w'?'selected':''}>최근 1주</option>
      <option value="1m" ${_transferPeriod==='1m'?'selected':''}>최근 1개월</option>
    </select>
  </div>`;
  if(!filtered.length) return h+`<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px;">해당 기간에 이관완료된 항목이 없습니다</div>`;
  const cardsHtml=filtered.map(({r,log,fromNeed,detectedAt})=>`<div style="display:flex;flex-direction:column;gap:5px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span style="background:#e3f2fd;color:#1565c0;border:1px solid #90caf9;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;">🔁 이관완료</span>
      ${log?`<span style="font-size:10px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;">(이전: [${log.status}] ${log.category})</span>`:(fromNeed?`<span style="background:#fce4ec;color:#c62828;border:1px solid #ef9a9a;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;" title="확인 절차 없이 체크필요 상태에서 바로 이관완료로 변경되었습니다">⚠️ 체크필요 → 이관완료</span>`:'')}
      <div onclick='jumpToCompanyInList(${JSON.stringify(r.company).replace(/'/g,"&apos;")})' style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;" title="클릭하면 전체 가망건 리스트에서 이 업체를 확인합니다"><strong style="font-size:12px;text-decoration:underline;text-decoration-style:dotted;">${r.company}</strong>${r.url?`<span onclick="event.stopPropagation();openUrl('${r.url}')" style="margin-left:4px;cursor:pointer;color:#3949ab;font-size:10px;">🔗</span>`:''}</div>
      <div style="font-size:11px;color:var(--text-sub);white-space:nowrap;flex-shrink:0;">👤 ${r.manager}</div>
      <div style="font-size:10px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;">감지일 ${detectedAt}</div>
    </div>
    ${log&&log.memo?`<div style="padding-left:2px;font-size:11px;color:var(--text-sub);">📝 ${log.memo.replace(/</g,'&lt;')}</div>`:''}
    ${(r.recalls&&r.recalls.length)?`<div style="padding-left:2px;">${renderRecallChips(r.recalls)}</div>`:''}
  </div>`).join('');
  h+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">${cardsHtml}</div>`;
  return h;
}
async function _ensureTransferDetected(items){
  for(const it of items){
    try{ await callServer('serverMarkTransferDetected',{role:SESSION.role,token:SESSION.token,company:it.company,manager:it.manager,firstCall:it.firstCall}); }catch(e){}
  }
  await loadCheckLog();
  refreshCheckSectionOnly();
}
// [v5.17] 체크필요에 뜬 업체를 처음 목격한 시점을 1회만 조용히 기록 — 앞으로 확인/보관 없이 이관완료로 바뀌는 경우를
// 정확히 판별하기 위함(과거 데이터는 기록이 없어 복원 불가, 지금부터 발생하는 건부터 정확하게 잡힘)
function _ensureNeedSeen(needItems){
  const toMark=[];
  needItems.forEach(({r})=>{
    const fc=normalizeDate(r.firstCall)||'';
    const already=_checkLogData.some(l=>l.company===r.company&&l.manager===r.manager&&l.firstCall===fc&&l.category==='체크필요목격');
    if(!already) toMark.push({company:r.company,manager:r.manager,firstCall:fc});
  });
  if(!toMark.length) return;
  (async()=>{
    for(const it of toMark){
      try{ await callServer('serverMarkNeedSeen',{role:SESSION.role,token:SESSION.token,company:it.company,manager:it.manager,firstCall:it.firstCall}); }catch(e){}
    }
    await loadCheckLog(); // 화면을 당장 바꾸는 정보가 아니라서 강제 리렌더는 생략, 다음 새로고침부터 반영됨
  })();
}
function onTransferPeriodChange(val){
  _transferPeriod=val;

}

        <div style="font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:4px;">🏢 본부/팀별 체크 필요 현황</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;">${buRows}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;padding-left:8px;">${teamRows}</div>
      </div>`;
    }
    // 본부장이 본부 보기: 팀별
    else if(isBuHead&&filterIsBu){
      const myBu=CURRENT_FILTER;
      const teamRows=TEAM_ORDER.filter(t=>t.startsWith(myBu==='BM2본부'?'BM2':'BM3')&&teamCount[t]).map(t=>`<button onclick="filterView('${t}')" style="background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;color:var(--text);">👥 ${t} ${teamCount[t]}건</button>`).join('');
      distHtml=teamRows?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        <div style="font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:4px;">👥 팀별 체크 필요 현황</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">${teamRows}</div>
      </div>`:'';
    }
    // 팀장이 팀 보기: 사원별
    else if((isTeamLead||isBuHead)&&(filterIsTeam||filterIsAll)){
      const memberRowsDist=Object.entries(memberCount).sort((a,b)=>b[1]-a[1]).map(([name,cnt])=>`<button onclick="filterView('${name}')" style="background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;color:var(--text);">👤 ${name} ${cnt}건</button>`).join('');
      distHtml=memberRowsDist?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        <div style="font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:4px;">👤 사원별 체크 필요 현황</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">${memberRowsDist}</div>
      </div>`:'';
    }

    // 사원별 처리 통계 (펼치기용)
    const memberStat={};
    processedThisMonth.forEach(l=>{
      if(!memberStat[l.manager])memberStat[l.manager]={processed:0,days:[]};
      memberStat[l.manager].processed++;
      const fc=normalizeDate(l.firstCall)||'';const acted=(l.actedAt||'').slice(0,10);
      if(fc&&acted){const d=Math.floor((new Date(acted)-new Date(fc))/86400000);if(d>=0)memberStat[l.manager].days.push(d);}
    });
    needItems.forEach(it=>{
      if(!memberStat[it.r.manager])memberStat[it.r.manager]={processed:0,days:[]};
      memberStat[it.r.manager]._pending=(memberStat[it.r.manager]._pending||0)+1;
    });
    const memberRows=Object.entries(memberStat).map(([name,d])=>{
      const avg=d.days.length?(d.days.reduce((a,b)=>a+b,0)/d.days.length).toFixed(1):'-';
      return{name,processed:d.processed,avg,pending:d._pending||0};
    }).sort((a,b)=>b.processed-a.processed);

    return`<div class="card" style="padding:14px;margin-bottom:14px;background:var(--surface2);">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">

        <span>평균 <strong style="color:var(--text);">${avgDays}일</strong></span>
        <span>📌 보관 중 <strong style="color:#7b1fa2;">${archiveItems.length}건</strong></span>
      </div>
      ${distHtml}
      <div id="ckSummaryDetail" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        ${memberRows.length?memberRows.map(m=>`<div style="display:flex;gap:12px;font-size:11px;color:var(--text-sub);padding:3px 0;flex-wrap:wrap;"><span style="min-width:70px;font-weight:600;color:var(--text);">👤 ${m.name}</span><span>처리 ${m.processed}건</span><span>평균 ${m.avg}일</span><span style="color:${m.pending>0?'#c62828':'var(--text-muted)'};">미처리 ${m.pending}건</span></div>`).join(''):'<div style="font-size:11px;color:var(--text-muted);">데이터가 없습니다</div>'}
      </div>
    </div>`;
  };

  const renderNeedCard=({r,cats})=>{
    const recallCnt=r.recalls?r.recalls.length:0;
    const fc=fmtRecallDate(normalizeDate(r.firstCall));
    const badgesHtml=cats.map(({cat,reason})=>
      `<span class="recall-tip" style="cursor:help;"><span style="background:${CHECK_CAT_COLOR[cat]}1a;color:${CHECK_CAT_COLOR[cat]};border:1px solid ${CHECK_CAT_COLOR[cat]}55;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;">${cat}</span><span class="tip-content">${(reason||'').replace(/</g,'&lt;')}</span></span>`
    ).join('');
    const confirmItem={company:r.company,manager:r.manager,firstCall:normalizeDate(r.firstCall)||'',cats:cats.map(c=>c.cat),grade:r.grade||'',latestRecall:r._latestDate||''};

    // [v5.9] 체크필요 → 보관 직행 버튼 (필수 코멘트 입력 후 확정)

        <button onclick='openArchiveBox("${arcUid}")' style="padding:4px 10px;border-radius:14px;border:1px solid #7b1fa2;background:var(--surface);color:#7b1fa2;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;">📌 보관</button>
        ${hqBtn}
        ${badgesHtml}
        <div onclick='jumpToCompanyInList(${JSON.stringify(r.company).replace(/'/g,"&apos;")})' style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;" title="클릭하면 전체 가망건 리스트에서 이 업체를 확인합니다"><strong style="font-size:12px;text-decoration:underline;text-decoration-style:dotted;">${r.company}</strong>${r.url?`<span onclick="event.stopPropagation();openUrl('${r.url}')" style="margin-left:4px;cursor:pointer;color:#3949ab;font-size:10px;">🔗</span>`:''}</div>
        <div style="font-size:11px;color:var(--text-sub);white-space:nowrap;flex-shrink:0;">👤 ${r.manager}</div>
        <div style="font-size:11px;white-space:nowrap;flex-shrink:0;">${gradeBadge(r.grade)}</div>
      </div>
      <div style="display:flex;gap:10px;padding-left:2px;font-size:10px;color:var(--text-muted);flex-wrap:wrap;">
        <span>💰 ${fmtB(r.budget)||'-'}</span>
        <span>${renderFirstCallChip(r)}</span>
        <span>🔁 재콜 ${recallCnt}회</span>
      </div>
      ${cats.some(c=>c.cat==='숨은가망')?`<div style="padding-left:2px;">${renderLongMemoChips(r.recalls)}</div>`:''}
      <div id="arcBox_${arcUid}" style="display:none;margin-top:2px;padding:8px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:8px;">

        <textarea id="arcTa_${arcUid}" placeholder="예: 예산 보류, 장기 관망 등" style="width:100%;min-height:48px;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;resize:vertical;box-sizing:border-box;background:var(--surface);color:var(--text);"></textarea>

        <span style="background:${CHECK_CAT_COLOR[l.category]}1a;color:${CHECK_CAT_COLOR[l.category]};border:1px solid ${CHECK_CAT_COLOR[l.category]}55;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;">${l.category}</span>

        <div onclick='jumpToCompanyInList(${JSON.stringify(l.company).replace(/'/g,"&apos;")})' style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;" title="클릭하면 전체 가망건 리스트에서 이 업체를 확인합니다"><strong style="font-size:12px;text-decoration:underline;text-decoration-style:dotted;">${l.company}</strong>${url?`<span onclick="event.stopPropagation();openUrl('${url}')" style="margin-left:4px;cursor:pointer;color:#3949ab;font-size:10px;">🔗</span>`:''}</div>

        :(matched?`<div style="padding-left:2px;">${renderFirstCallChip(matched)}${(matched.recalls&&matched.recalls.length)?renderRecallChipsMarked(matched.recalls,l.actedAt):''}</div>`:'')

          <button onclick="hideMemoInput('${memoKey}',${hasMemo})" style="padding:4px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);font-size:10px;cursor:pointer;white-space:nowrap;">취소</button>

  const renderDeletedCard=(l)=>{

  const emptyMsg=(msg)=>`<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px;grid-column:1/-1;">${msg}</div>`;
  const grid2=(itemsHtml)=>`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">${itemsHtml}</div>`;
  const PAGE_SIZE=10;
  window._checkPageState=window._checkPageState||{nongmg:1,gmg:1,done:1,archive:1};
  const paginated=(items,pageKey,renderFn)=>{
    if(!items.length) return emptyMsg('해당 항목이 없습니다');
    const totalPages=Math.max(1,Math.ceil(items.length/PAGE_SIZE));
    let page=window._checkPageState[pageKey]||1;
    if(page>totalPages)page=totalPages;
    window._checkPageState[pageKey]=page;
    const start=(page-1)*PAGE_SIZE;
    const pageItems=items.slice(start,start+PAGE_SIZE);
    let html=grid2(pageItems.map(renderFn).join(''));
    if(totalPages>1){
      html+='<div style="display:flex;justify-content:center;gap:4px;margin-top:12px;flex-wrap:wrap;">';
      html+=`<button onclick="changeCheckPage('${pageKey}',${page-1})" ${page<=1?'disabled':''} style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:${page<=1?'var(--text-muted)':'var(--text)'};font-size:11px;cursor:${page<=1?'default':'pointer'};">‹</button>`;
      for(let p=1;p<=totalPages;p++){
        html+=`<button onclick="changeCheckPage('${pageKey}',${p})" style="padding:4px 10px;border-radius:6px;border:1px solid ${p===page?'#3949ab':'var(--border)'};background:${p===page?'#3949ab':'var(--surface)'};color:${p===page?'#fff':'var(--text)'};font-size:11px;font-weight:${p===page?'700':'400'};cursor:pointer;">${p}</button>`;
      }
      html+=`<button onclick="changeCheckPage('${pageKey}',${page+1})" ${page>=totalPages?'disabled':''} style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:${page>=totalPages?'var(--text-muted)':'var(--text)'};font-size:11px;cursor:${page>=totalPages?'default':'pointer'};">›</button>`;
      html+='</div>';
    }
    return html;
  };

      <button id="ct_done" onclick="switchCheckTab('done')" style="padding:8px 20px;border:none;background:none;font-size:13px;font-weight:400;color:var(--text-sub);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-2px;">✅ 확인 <span style="background:#f0f0f0;color:var(--text-sub);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:4px;">${doneItems.length}</span></button>
      <button id="ct_archive" onclick="switchCheckTab('archive')" style="padding:8px 20px;border:none;background:none;font-size:13px;font-weight:400;color:var(--text-sub);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-2px;">📌 보관 <span style="background:#f0f0f0;color:var(--text-sub);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:4px;">${archiveItems.length}</span></button>
      <button id="ct_transfer" onclick="switchCheckTab('transfer')" style="padding:8px 20px;border:none;background:none;font-size:13px;font-weight:400;color:var(--text-sub);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-2px;">🔁 이관완료 <span style="background:#f0f0f0;color:var(--text-sub);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:4px;">${transferItems.length}</span></button>
      ${isHqLevel?`<button id="ct_hq" onclick="switchCheckTab('hq')" style="padding:8px 20px;border:none;background:none;font-size:13px;font-weight:400;color:var(--text-sub);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-2px;">🏢 본부확인 <span style="background:#f0f0f0;color:var(--text-sub);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:4px;">${hqItems.length}</span></button>`:''}
    </div>
    <div id="ctb_need">${(()=>{
      if(!needItems.length) return emptyMsg('체크할 가망건이 없습니다');
      const GMG_CATS=['컨택5회+','신규3일','컨택정체'];

      let html='<div style="display:flex;gap:6px;margin-bottom:12px;">';

      html+='</div>';
      html+=`<div id="ctSubSec_nongmg" class="ct-sub-sec">`;
      html+=`<div style="font-size:12px;font-weight:700;color:#7b1fa2;margin:4px 0 8px;display:flex;align-items:center;gap:6px;"><span style="width:4px;height:14px;background:#7b1fa2;border-radius:2px;display:inline-block;"></span>비가망건 (${nonGmgItems.length})</div>`;
      html+=paginated(nonGmgItems,'nongmg',renderNeedCard);
      html+='</div>';
      html+=`<div id="ctSubSec_gmg" class="ct-sub-sec">`;
      html+=`<div style="font-size:12px;font-weight:700;color:#1565c0;margin:16px 0 8px;display:flex;align-items:center;gap:6px;"><span style="width:4px;height:14px;background:#1565c0;border-radius:2px;display:inline-block;"></span>가망건 (${gmgItems.length})</div>`;

      </div>
      <div id="ctDoneMainSec_active">${(()=>{
        if(!doneItems.length) return emptyMsg('확인완료 항목이 없습니다');
        const doneNonGmg=doneItems.filter(l=>!isCurrentlyGmg(l));
        const doneGmg=doneItems.filter(l=>isCurrentlyGmg(l));
        let h='<div style="display:flex;gap:6px;margin-bottom:12px;">';
        h+=`<button id="ctDoneSub_all" onclick="switchCheckLogSub('done','all')" class="nbtn na" style="font-size:11px;">전체</button>`;
        h+=`<button id="ctDoneSub_nongmg" onclick="switchCheckLogSub('done','nongmg')" class="nbtn" style="font-size:11px;">비가망건 (${doneNonGmg.length})</button>`;
        h+=`<button id="ctDoneSub_gmg" onclick="switchCheckLogSub('done','gmg')" class="nbtn" style="font-size:11px;">가망건 (${doneGmg.length})</button>`;
        h+='</div>';
        h+=`<div id="ctDoneSubSec_nongmg" class="ct-sub-sec">`+paginated(doneNonGmg,'done_nongmg',l=>renderLogCard(l,true))+`</div>`;
        h+=`<div id="ctDoneSubSec_gmg" class="ct-sub-sec">`+paginated(doneGmg,'done_gmg',l=>renderLogCard(l,true))+`</div>`;
        return h;
      })()}</div>
      <div id="ctDoneMainSec_deleted" style="display:none;">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">ℹ️ 삭제 처리된 항목입니다. 가망도가 바뀌거나 새 컨택이 생기면 체크필요에 다시 나타납니다.</div>
        ${doneDeletedItems.length?paginated(doneDeletedItems,'done_deleted',renderDeletedCard):emptyMsg('삭제완료 항목이 없습니다')}
      </div>
    </div>
    <div id="ctb_archive" style="display:none;">
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <button id="ctArchMain_active" onclick="switchCheckLogMain('archive','active')" class="nbtn na" style="font-size:11px;">📌 보관중 (${archiveItems.length})</button>
        <button id="ctArchMain_deleted" onclick="switchCheckLogMain('archive','deleted')" class="nbtn" style="font-size:11px;">🗑 삭제완료 (${archiveDeletedItems.length})</button>
      </div>
      <div id="ctArchMainSec_active">${(()=>{
        if(!archiveItems.length) return emptyMsg('보관된 항목이 없습니다');
        const archNonGmg=archiveItems.filter(l=>!isCurrentlyGmg(l));
        const archGmg=archiveItems.filter(l=>isCurrentlyGmg(l));
        let h='<div style="display:flex;gap:6px;margin-bottom:12px;">';
        h+=`<button id="ctArchSub_all" onclick="switchCheckLogSub('archive','all')" class="nbtn na" style="font-size:11px;">전체</button>`;
        h+=`<button id="ctArchSub_nongmg" onclick="switchCheckLogSub('archive','nongmg')" class="nbtn" style="font-size:11px;">비가망건 (${archNonGmg.length})</button>`;
        h+=`<button id="ctArchSub_gmg" onclick="switchCheckLogSub('archive','gmg')" class="nbtn" style="font-size:11px;">가망건 (${archGmg.length})</button>`;
        h+='</div>';
        h+=`<div id="ctArchSubSec_nongmg" class="ct-sub-sec">`+paginated(archNonGmg,'arch_nongmg',l=>renderLogCard(l,false))+`</div>`;
        h+=`<div id="ctArchSubSec_gmg" class="ct-sub-sec">`+paginated(archGmg,'arch_gmg',l=>renderLogCard(l,false))+`</div>`;
        return h;
      })()}</div>
      <div id="ctArchMainSec_deleted" style="display:none;">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">ℹ️ 삭제 처리된 항목입니다. 가망도가 바뀌거나 새 컨택이 생기면 체크필요에 다시 나타납니다.</div>
        ${archiveDeletedItems.length?paginated(archiveDeletedItems,'arch_deleted',renderDeletedCard):emptyMsg('삭제완료 항목이 없습니다')}
      </div>
    </div>
    <div id="ctb_transfer" style="display:none;">${renderTransferTab(transferItems)}</div>
    ${isHqLevel?`<div id="ctb_hq" style="display:none;">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">ℹ️ 본부장급 이상이 별도로 더블체크 표시한 항목입니다. 팀장의 확인완료/보관 흐름과는 독립적으로 관리되며, 원래 상태([확인완료]/[보관])는 그대로 유지됩니다.</div>
      ${hqItems.length?paginated(hqItems,'hq',l=>renderLogCard(l,l.status==='확인완료')):emptyMsg('본부확인 처리된 항목이 없습니다')}
    </div>`:''}
    </div>
  </div>`;
}

function toggleCheckSummaryDetail(){
  const detail=document.getElementById('ckSummaryDetail');
  const btn=document.getElementById('ckSummaryToggleBtn');
  if(!detail)return;
  const hidden=detail.style.display==='none';
  detail.style.display=hidden?'block':'none';
  if(btn) btn.textContent=hidden?'▲ 접기':'▼ 사원별로 보기';
}
function switchCheckSub(sub){
  const gmgSec=document.getElementById('ctSubSec_gmg');
  const nonGmgSec=document.getElementById('ctSubSec_nongmg');
  if(gmgSec) gmgSec.style.display=(sub==='all'||sub==='gmg')?'block':'none';
  if(nonGmgSec) nonGmgSec.style.display=(sub==='all'||sub==='nongmg')?'block':'none';
  ['all','nongmg','gmg'].forEach(s=>{
    const btn=document.getElementById('ctSub_'+s);
    if(btn) btn.classList.toggle('na',s===sub);
  });
}
// 확인완료(done) / 보관(archive) 탭 전용 가망건·비가망건 서브탭 전환
function switchCheckLogSub(tab,sub){
  const prefix=tab==='done'?'ctDone':'ctArch';
  const gmgSec=document.getElementById(prefix+'SubSec_gmg');
  const nonGmgSec=document.getElementById(prefix+'SubSec_nongmg');
  if(gmgSec) gmgSec.style.display=(sub==='all'||sub==='gmg')?'block':'none';
  if(nonGmgSec) nonGmgSec.style.display=(sub==='all'||sub==='nongmg')?'block':'none';
  ['all','nongmg','gmg'].forEach(s=>{
    const btn=document.getElementById(prefix+'Sub_'+s);
    if(btn) btn.classList.toggle('na',s===sub);
  });
}
// [v5.13] 확인/보관 탭 내부의 "활성/삭제완료" 대분류 전환
function switchCheckLogMain(tab,main){
  const prefix=tab==='done'?'ctDone':'ctArch';
  const activeSec=document.getElementById(prefix+'MainSec_active');
  const deletedSec=document.getElementById(prefix+'MainSec_deleted');
  if(activeSec) activeSec.style.display=main==='active'?'block':'none';
  if(deletedSec) deletedSec.style.display=main==='deleted'?'block':'none';
  ['active','deleted'].forEach(m=>{
    const btn=document.getElementById(prefix+'Main_'+m);
    if(btn) btn.classList.toggle('na',m===main);
  });
}
function switchCheckTab(tab){
  _checkTab=tab;
  ['need','done','archive','transfer','hq'].forEach(t=>{
    const btn=document.getElementById('ct_'+t);
    const body=document.getElementById('ctb_'+t);
    const isActive=t===tab;
    const color=t==='need'?'#c62828':t==='done'?'#2e7d32':t==='archive'?'#7b1fa2':t==='transfer'?'#1565c0':'#3949ab';
    if(btn){btn.style.fontWeight=isActive?'700':'400';btn.style.color=isActive?color:'var(--text-sub)';btn.style.borderBottom=isActive?'3px solid '+color:'3px solid transparent';}
    if(body)body.style.display=isActive?'block':'none';
  });
}

async function checkConfirm(btn,item){
  if(btn){
    if(btn.disabled)return; // 중복 클릭 완전 차단
    btn.disabled=true;btn.style.opacity='0.5';btn.style.cursor='default';btn.textContent='처리 중...';
  }
  try{
    // 한 업체에 여러 조건(cats)이 동시에 걸린 경우 전부 확인완료로 순차 저장
    const catList=item.cats||[item.cat];
    for(const cat of catList){
      const res=await callServer('serverSaveCheckLog',{role:SESSION.role,token:SESSION.token,company:item.company,manager:item.manager,firstCall:item.firstCall,category:cat,status:'확인완료',grade:item.grade||''});
      if(!res||!res.success) throw new Error((res&&res.error)||'처리 실패');
    }
    toast('✅ 확인되었습니다');await loadCheckLog();refreshCheckSectionOnly();
  }catch(e){toast('❌ '+e.message,'err');if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';btn.textContent='✔ 확인';}}
}
// [v5.9] 보관 처리는 반드시 코멘트를 입력해야 진행되도록 인라인 박스 방식으로 변경
function openArchiveBox(uid){
  const box=document.getElementById('arcBox_'+uid);
  if(box){box.style.display='block';const ta=document.getElementById('arcTa_'+uid);if(ta)ta.focus();}
}
function closeArchiveBox(uid){
  const box=document.getElementById('arcBox_'+uid);
  if(box)box.style.display='none';
}
async function confirmArchiveBox(uid,item){
  const ta=document.getElementById('arcTa_'+uid);
  const memo=ta?ta.value.trim():'';
  if(!memo){toast('❌ 보관 사유(코멘트)를 입력해주세요','err');if(ta)ta.focus();return;}
  const btn=document.getElementById('arcBtn_'+uid);
  if(btn){if(btn.disabled)return;btn.disabled=true;btn.style.opacity='0.5';btn.style.cursor='default';btn.textContent='처리 중...';}
  try{
    // 체크필요 카드에서 온 경우 여러 조건(cats)을 한 번에, 개별 로그 카드는 단일 조건(cat)만 보관 처리
    const catList=item.cats||[item.cat];
    for(const cat of catList){
      const res=await callServer('serverSaveCheckLog',{role:SESSION.role,token:SESSION.token,company:item.company,manager:item.manager,firstCall:item.firstCall,category:cat,status:'보관',memo,grade:item.grade||''});
      if(!res||!res.success) throw new Error((res&&res.error)||'처리 실패');
    }
    toast('📌 보관함으로 이동');await loadCheckLog();refreshCheckSectionOnly();
  }catch(e){
    toast('❌ '+e.message,'err');
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';btn.textContent='보관 확정';}
  }
}
async function toggleHqCheck(btn,item){
  if(btn){if(btn.disabled)return;btn.disabled=true;btn.style.opacity='0.5';}
  try{
    const catList=item.cats||[item.cat];
    let lastRes=null;
    for(const cat of catList){
      const res=await callServer('serverToggleHqCheck',{role:SESSION.role,token:SESSION.token,company:item.company,manager:item.manager,firstCall:item.firstCall,category:cat});
      if(!res||!res.success) throw new Error((res&&res.error)||'처리 실패');
      lastRes=res;
    }
    toast(lastRes&&lastRes.hqChecked==='Y'?'🏢 본부확인 처리':'본부확인 해제');await loadCheckLog();refreshCheckSectionOnly();
  }catch(e){toast('❌ '+e.message,'err');if(btn){btn.disabled=false;btn.style.opacity='1';}}
}
async function checkDelete(item){
  if(!confirm('삭제 처리됩니다.\n이후 가망도가 바뀌거나 새로운 컨택(재콜)이 생기면 체크필요 목록에 다시 나타날 수 있습니다.\n계속하시겠습니까?'))return;
  try{
    const res=await callServer('serverDeleteCheckLog',{role:SESSION.role,token:SESSION.token,company:item.company,manager:item.manager,firstCall:item.firstCall,category:item.cat,grade:item.grade||'',lastRecall:item.latestRecall||''});
    if(res&&res.success){toast('🗑 삭제 완료');await loadCheckLog();refreshCheckSectionOnly();}
    else toast('❌ '+(res.error||'삭제 실패'),'err');
  }catch(e){toast('❌ '+e.message,'err');}
}
function showMemoInput(memoKey){
  const view=document.getElementById('memoView_'+memoKey);
  const empty=document.getElementById('memoEmpty_'+memoKey);
  const input=document.getElementById('memoInput_'+memoKey);
  if(view)view.style.display='none';
  if(empty)empty.style.display='none';
  if(input){input.style.display='flex';const ta=document.getElementById('memoTa_'+memoKey);if(ta)ta.focus();}
}
function hideMemoInput(memoKey,hadMemo){
  const view=document.getElementById('memoView_'+memoKey);
  const empty=document.getElementById('memoEmpty_'+memoKey);
  const input=document.getElementById('memoInput_'+memoKey);
  if(input)input.style.display='none';
  if(hadMemo){if(view)view.style.display='flex';}
  else{if(empty)empty.style.display='flex';}
}
async function saveCheckMemo(item){
  const ta=document.getElementById('memoTa_'+item.memoKey);
  const memo=ta?ta.value.trim():'';
  try{
    const res=await callServer('serverSaveCheckMemo',{role:SESSION.role,token:SESSION.token,company:item.company,manager:item.manager,firstCall:item.firstCall,category:item.cat,memo});
    if(res&&res.success){toast('📝 메모 저장 완료');await loadCheckLog();refreshCheckSectionOnly();}
    else toast('❌ '+(res.error||'저장 실패'),'err');
  }catch(e){toast('❌ '+e.message,'err');}
}
function changeCheckPage(pageKey,page){
  window._checkPageState=window._checkPageState||{};
  window._checkPageState[pageKey]=page;
  refreshCheckSectionOnly();
}
function refreshCheckSectionOnly(){
  const wrap=document.getElementById('jump-check');if(!wrap)return;
  const rows=CURRENT_FILTER==='all'?CURRENT_ROWS:(()=>{const allNames=Object.values(ORG_MAP).flatMap(bu=>Object.values(bu).flat());const isMember=allNames.includes(CURRENT_FILTER);return isMember?CURRENT_ROWS.filter(r=>r.manager===CURRENT_FILTER):CURRENT_ROWS.filter(r=>r.bu===CURRENT_FILTER||r.team===CURRENT_FILTER);})();
  wrap.innerHTML=renderCheckSection(rows);

function applyFilter(){curPage=1;renderListBody(getFilteredBase());}
function getWeekRange(){
  const d=new Date();const day=d.getDay();
  const diffToMonday=day===0?-6:1-day;
  const monday=new Date(d);monday.setDate(d.getDate()+diffToMonday);
  const friday=new Date(monday);friday.setDate(monday.getDate()+4);
  const fmt=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return{start:fmt(monday),end:fmt(friday)};
}
function getMonthRange(){
  const d=new Date();
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);
  const fmt=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return{start:fmt(first),end:fmt(last)};
}
function classifyRow(r){
  const fc=normalizeDate(r.firstCall)||'';
  if(!fc)return{type:'none',label:''};
  const week=getWeekRange();const month=getMonthRange();
  const now=new Date();const curYear=now.getFullYear();
  const m=fc.match(/^(\d{4})-(\d{2})/);
  const fcYear=m?parseInt(m[1]):0;const fcMonth=m?parseInt(m[2]):0;
  const monthLabel=fcYear===curYear?fcMonth+'월신규':String(fcYear).slice(2)+'-'+fcMonth+'월신규';
  const isThisWeek=fc>=week.start&&fc<=week.end;
  const isThisMonth=fc>=month.start&&fc<=month.end;
  const hasRecall=!!(r.recalls&&r.recalls.length);
  if(isThisWeek)return{type:'week',label:monthLabel,hasRecall};
  if(isThisMonth)return{type:'month',label:monthLabel,hasRecall};
  return{type:'past',label:monthLabel,hasRecall};
}
function isPromo(r){
  const fc=normalizeDate(r.firstCall)||'';
  if(!fc) return false;
  const month=getMonthRange();
  const isThisMonth=fc>=month.start&&fc<=month.end;
  if(!isThisMonth) return false;
  const PROMO_GRADES=['단기','장기','권한오픈','권한+브리핑'];
  if(PROMO_GRADES.includes(r.grade)&&r.budget>0&&r.advertiserManager&&r.phone&&r.email) return true;
  if(r.grade==='이관완료') return true;
  return false;
}
function getRecentBizDates(n){const dates=[];const d=new Date();while(dates.length<n){const day=d.getDay();if(day!==0&&day!==6)dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));d.setDate(d.getDate()-1);}return new Set(dates);}

      const bb=s.budgetBands;const keys=Object.keys(bb);

      const GRP_COLORS=['#3949ab','#7b1fa2','#00695c','#e65100','#c62828','#1565c0','#2e7d32','#6a1b9a'];

let _panelType=null;
let _panelFilter='all'; // 사이드패널 전용 독립 필터 (메인 대시보드와 무관)

function getPanelFilterOptions(){
  // 로그인 역할에 따라 관리자모드/본부장/팀장 각각 다른 범위 반환
  const role=SESSION.role;
  const opts=[]; // {value,label,type}
  if(role==='center'||role==='관리자모드'||role==='master'){
    opts.push({value:'all',label:'🏆 전체',type:'all'});
    BU_ORDER.forEach(bu=>{
      if(!ORG_MAP[bu])return;
      opts.push({value:bu,label:(bu==='BM2본부'?'🔵 ':'🟣 ')+bu,type:'bu'});
      TEAM_ORDER.filter(t=>t.startsWith(bu==='BM2본부'?'BM2':'BM3')).forEach(team=>{
        if(!ORG_MAP[bu][team])return;
        opts.push({value:team,label:'👥 '+team,type:'team'});
        ORG_MAP[bu][team].forEach(name=>opts.push({value:name,label:'👤 '+name,type:'member'}));
      });
    });
  }else if(role==='bm2'||role==='bm3'){
    const myBU=role==='bm2'?'BM2본부':'BM3본부';
    opts.push({value:'all',label:'전체',type:'all'});
    TEAM_ORDER.filter(t=>t.startsWith(role==='bm2'?'BM2':'BM3')).forEach(team=>{
      if(!ORG_MAP[myBU]||!ORG_MAP[myBU][team])return;
      opts.push({value:team,label:'👥 '+team,type:'team'});
      ORG_MAP[myBU][team].forEach(name=>opts.push({value:name,label:'👤 '+name,type:'member'}));
    });
  }else if(['bm2_2','bm2_3','bm3_2'].includes(role)){
    const teamName=role==='bm2_2'?'BM2-2팀':role==='bm2_3'?'BM2-3팀':'BM3-2팀';
    const bu=role.startsWith('bm2')?'BM2본부':'BM3본부';
    opts.push({value:'all',label:'👥 '+teamName+' 전체',type:'all'});
    (ORG_MAP[bu]?.[teamName]||[]).forEach(name=>opts.push({value:name,label:'👤 '+name,type:'member'}));
  }
  return opts;
}

function getPanelStats(){
  const filter=_panelFilter;
  const allNames=Object.values(ORG_MAP).flatMap(bu=>Object.values(bu).flat());
  const isMember=allNames.includes(filter);
  const rows=filter==='all'?CURRENT_ROWS:isMember?CURRENT_ROWS.filter(r=>r.manager===filter):CURRENT_ROWS.filter(r=>r.bu===filter||r.team===filter);
  return calcClientStats(rows);
}

function renderPanelFilterBar(){
  const opts=getPanelFilterOptions();
  if(opts.length<=1)return''; // 선택지 없으면 필터 숨김
  const optionsHtml=opts.map(o=>`<option value="${o.value}"${o.value===_panelFilter?' selected':''}>${o.label}</option>`).join('');
  return`<div style="margin-bottom:14px;padding:10px 12px;background:var(--surface2);border-radius:10px;">
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">🔍 패널 내에서만 다른 범위로 조회 (메인 대시보드에는 반영되지 않습니다)</div>
    <select onchange="changePanelFilter(this.value)" style="width:100%;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;">${optionsHtml}</select>
  </div>`;
}

function changePanelFilter(val){
  _panelFilter=val;
  renderSidePanelBody();
}

function renderSidePanelBody(){
  const title=document.getElementById('sidePanelTitle');
  const body=document.getElementById('sidePanelBody');
  if(!body)return;
  const stats=getPanelStats();
  const filterBar=renderPanelFilterBar();
  const filterLabelForTitle=_panelFilter==='all'?getFilterLabel():_panelFilter;
  if(_panelType==='transfer'){
    title.textContent='🏆 이관완료 전환 현황 ('+filterLabelForTitle+')';
    body.innerHTML=filterBar+renderRecentTransfers(stats);
    setTimeout(()=>{if(typeof rtReset==='function')rtReset();},50);
  }else if(_panelType==='contact'){
    title.textContent='🔗 컨택포인트 현황 ('+filterLabelForTitle+')';
    body.innerHTML=filterBar+renderContactStat(stats);
  }else if(_panelType==='recall'){
    title.textContent='📞 재콜 현황 ('+filterLabelForTitle+')';
    body.innerHTML=filterBar+renderTodayRecall(stats);
  }else if(_panelType==='member'){
    title.textContent='👤 담당자별 가망건 현황 ('+getFilterLabel()+')';
    body.innerHTML=renderMemberStat(window._lastStats);
    setTimeout(renderMemberCardBody,0);
  }
  // 패널 내부는 항상 펼친 상태로 표시
  setTimeout(()=>{
    body.querySelectorAll('.cbody.collapsed').forEach(el=>el.classList.remove('collapsed'));
    body.querySelectorAll('.carr').forEach(el=>el.style.transform='rotate(0deg)');
  },0);
}

function openSidePanel(type){
  const panel=document.getElementById('sidePanel');
  const overlay=document.getElementById('sidePanelOverlay');
  if(!panel)return;
  if(!window._lastStats){toast('데이터를 불러오는 중입니다','err');return;}
  _panelType=type;
  _panelFilter=CURRENT_FILTER; // 열 때는 메인 화면 필터로 시작
  renderSidePanelBody();
  overlay.style.display='block';
  panel.style.display='block';
  requestAnimationFrame(()=>panel.classList.add('open'));
}
function closeSidePanel(){
  const panel=document.getElementById('sidePanel');
  const overlay=document.getElementById('sidePanelOverlay');
  if(!panel)return;
  panel.classList.remove('open');
  overlay.style.display='none';
  setTimeout(()=>{panel.style.display='none';},250);
}
