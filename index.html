<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>미래아이엔씨 가망건 통합 대시보드 v5.13</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f5f7ff;--border:#e8eaf6;
  --text:#333;--text-sub:#777;--text-muted:#aaa;
  --header-bg:linear-gradient(135deg,#1a237e,#283593);
  --card-shadow:0 2px 10px rgba(0,0,0,.07);
  --th-bg:#e8eaf6;--th-color:#555;--td-border:#f0f0f0;
  --rank1:#fff9c4;--rank2:#f1f8e9;--rank3:#e8f4fd;
  --badge-bg:rgba(255,255,255,.15);
  --toggle-bg:#ccc;--overlay-bg:rgba(0,0,0,.5);
}
[data-theme="dark"]{
  --bg:#0d1117;--surface:#161b22;--surface2:#1f2937;--border:#30363d;
  --text:#e6edf3;--text-sub:#8b949e;--text-muted:#484f58;
  --header-bg:linear-gradient(135deg,#0d1b4b,#091235);
  --card-shadow:0 2px 14px rgba(0,0,0,.4);
  --th-bg:#1f2937;--th-color:#8b949e;--td-border:#30363d;
  --rank1:#3a3510;--rank2:#143014;--rank3:#102240;
  --badge-bg:rgba(255,255,255,.08);
  --toggle-bg:#4a6cf7;--overlay-bg:rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Pretendard,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--header-bg);}
.login-box{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
[data-theme="dark"] .login-box{background:#161b22;border:1px solid #30363d;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo h2{font-size:22px;font-weight:700;color:#1a237e;margin-top:8px;}
[data-theme="dark"] .login-logo h2{color:#90caf9;}
.login-logo p{font-size:13px;color:#888;margin-top:4px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:6px;}
.login-field select,.login-field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface);color:var(--text);outline:none;transition:border .2s;}
.login-field select:focus,.login-field input:focus{border-color:#3949ab;}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:filter .2s;}
.login-btn:hover{filter:brightness(1.1);}
.login-btn:disabled{background:#ccc;cursor:not-allowed;}
.login-error{background:#fce4ec;color:#c62828;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;display:none;}
.login-error.show{display:block;}
.header{background:var(--header-bg);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;}
.header-left h1{font-size:18px;font-weight:700;}
.header-left .scope{font-size:12px;opacity:.75;margin-top:3px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.user-chip{background:var(--badge-bg);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.2);}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:background .2s;}
.logout-btn:hover{background:rgba(255,255,255,.2);}
.theme-btn{background:var(--badge-bg);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;}
.container{max-width:1300px;margin:0 auto;padding:20px;}
.nav-wrap{background:var(--surface);border-radius:12px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--card-shadow);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.nav-lbl{font-size:12px;color:var(--text-sub);font-weight:600;margin-right:4px;}
.nbtn{padding:6px 14px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-sub);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500;}
.nbtn:hover{border-color:#3949ab;color:#3949ab;}
.nbtn.na{background:#3949ab;color:#fff;border-color:#3949ab;}
.nbtn.na-bm2{background:#1565c0;color:#fff;border-color:#1565c0;}
.nbtn.na-bm3{background:#6a1b9a;color:#fff;border-color:#6a1b9a;}
.nbtn.na-team{background:#00695c;color:#fff;border-color:#00695c;}
.nbtn.na-member{background:#e65100;color:#fff;border-color:#e65100;}
.nbtn.mbr-bm2{background:#e3f2fd;color:#1565c0;border-color:#90caf9;}
.nbtn.mbr-bm2:hover{background:#1565c0;color:#fff;border-color:#1565c0;}
.nbtn.mbr-bm3{background:#f3e5f5;color:#7b1fa2;border-color:#ce93d8;}
.nbtn.mbr-bm3:hover{background:#7b1fa2;color:#fff;border-color:#7b1fa2;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;}
.card{background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:var(--card-shadow);}
.card-lbl{font-size:11px;color:var(--text-sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.card-val{font-size:26px;font-weight:700;}
.cv-blue{color:#3949ab;}.cv-green{color:#2e7d32;}.cv-orange{color:#e65100;}
.cv-purple{color:#6a1b9a;}.cv-red{color:#c62828;}.cv-teal{color:#00695c;}
.card-sub{font-size:11px;color:var(--text-muted);margin-top:3px;}
.pbar{background:var(--border);border-radius:4px;height:5px;margin-top:8px;overflow:hidden;}
.pb{height:100%;border-radius:4px;transition:width .6s;}
.pb-b{background:linear-gradient(90deg,#3949ab,#42a5f5);}
.pb-g{background:linear-gradient(90deg,#2e7d32,#66bb6a);}
.pb-o{background:linear-gradient(90deg,#e65100,#ffa726);}
.pb-p{background:linear-gradient(90deg,#6a1b9a,#ab47bc);}
.pb-t{background:linear-gradient(90deg,#00695c,#26a69a);}
.sec{background:var(--surface);border-radius:12px;padding:18px 20px;box-shadow:var(--card-shadow);margin-bottom:14px;}
.sec-hd{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.sh-b{color:#3949ab;}.sh-g{color:#2e7d32;}.sh-o{color:#e65100;}
.sh-p{color:#6a1b9a;}.sh-r{color:#c62828;}.sh-t{color:#00695c;}
.chd{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:14px;user-select:none;}
.carr{font-size:12px;color:var(--text-sub);transition:transform .3s;}
.cbody{overflow:hidden;transition:max-height .35s,opacity .3s;max-height:6000px;opacity:1;}
.cbody.col,.cbody.collapsed{max-height:0!important;opacity:0;}
.grade-badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;}
.gb-none{background:#f5f5f5;color:#757575;}
.gb-recall{background:#e3f2fd;color:#1565c0;}
.gb-short{background:#fff3e0;color:#e65100;}
.gb-long{background:#fce4ec;color:#c62828;}
.gb-open{background:#f3e5f5;color:#6a1b9a;}
.gb-briefing{background:#e8eaf6;color:#3949ab;}
.gb-done{background:#e8f5e9;color:#2e7d32;}
[data-theme="dark"] .gb-none{background:#2a2a2a;color:#9e9e9e;}
[data-theme="dark"] .gb-recall{background:#0d2b6b;color:#90caf9;}
[data-theme="dark"] .gb-short{background:#2a1500;color:#ffb74d;}
[data-theme="dark"] .gb-long{background:#2a0a0a;color:#ef9a9a;}
[data-theme="dark"] .gb-open{background:#2a0a4a;color:#ce93d8;}
[data-theme="dark"] .gb-briefing{background:#1a1f4a;color:#9fa8da;}
[data-theme="dark"] .gb-done{background:#143014;color:#81c784;}
.bu-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;}
.bb-bm2{background:#e3f2fd;color:#1565c0;}
.bb-bm3{background:#f3e5f5;color:#6a1b9a;}
[data-theme="dark"] .bb-bm2{background:#0d2b6b;color:#90caf9;}
[data-theme="dark"] .bb-bm3{background:#2a0a4a;color:#ce93d8;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--th-bg);color:var(--th-color);padding:9px 10px;text-align:left;font-weight:600;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--td-border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.r1{background:var(--rank1);}tr.r2{background:var(--rank2);}tr.r3{background:var(--rank3);}
tr:hover td{background:var(--surface2);}
.tbl-wrap{overflow-x:auto;}
.compare-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;border-top:4px solid #3949ab;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.compare-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1);}
.compare-card.bm2{border-top-color:#1565c0;}
.compare-card.bm3{border-top-color:#6a1b9a;}
.compare-card.team{border-top-color:#00695c;}
.cc-name{font-size:14px;font-weight:700;margin-bottom:10px;}
.cc-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.cc-lbl{color:var(--text-sub);}
.cc-val{font-weight:600;}
.recall-card{background:var(--surface2);border:1px solid var(--border);border-left:4px solid #c62828;border-radius:10px;padding:14px;}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.rc-company{font-size:14px;font-weight:700;color:#3949ab;}
.rc-meta{font-size:11px;color:var(--text-sub);margin-bottom:3px;}
.rc-recalls{background:var(--bg);border-radius:7px;padding:8px 10px;margin-top:6px;font-size:11px;}
.chart-box{position:relative;height:200px;}
.ib-wrap{display:flex;align-items:center;gap:6px;}
.ib{height:7px;border-radius:3px;min-width:2px;}
.cp-row{margin-bottom:7px;}
.cp-lbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;}
.cp-track{background:var(--border);border-radius:3px;height:7px;}
.cp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3949ab,#42a5f5);transition:width .5s;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.fsel,.finput{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;}
.finput{flex:1;min-width:120px;}
.abar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.rbtn{background:var(--surface);border:1px solid var(--border);color:var(--text-sub);padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;}
.dlbtn{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;padding:7px 16px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:600;}
.lov{display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:999;justify-content:center;align-items:center;flex-direction:column;}
.lov.show{display:flex;}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
.ltxt{color:#fff;margin-top:14px;font-size:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spin-cmp{to{transform:rotate(360deg);transform-origin:65px 65px;}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.no-cap{display:none!important;}
@media(max-width:900px){.g4,.g6{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr 1fr;}}
@media(max-width:580px){.g2,.g3,.g4,.g6{grid-template-columns:1fr;}}
.recall-tip{position:relative;display:inline-block;cursor:default;}
.recall-tip .tip-content{display:none;position:fixed;background:#1e2130;color:#e0e4f0;font-size:13px;line-height:1.7;padding:10px 14px;border-radius:8px;white-space:pre-wrap;min-width:200px;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:9999;word-break:keep-all;border:1px solid #2e3250;pointer-events:none;}
.recall-tip:hover .tip-content{display:block;}
.recall-tip .tip-content::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1e2130;}
</style>
</head>
<body>
<div class="lov" id="lov"><div class="spinner"></div><div class="ltxt" id="ltxt">불러오는 중...</div></div>
<div class="toast" id="toast"></div>
<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <div style="font-size:40px;">📊</div>
        <h2>가망건 통합 대시보드</h2>
        <p>권한에 맞는 역할을 선택하고 비밀번호를 입력하세요</p>
      </div>
      <div class="login-field">
        <label>역할 선택</label>
        <select id="roleSelect">
          <option value="">-- 역할 선택 --</option>
          <option value="관리자모드">🔑 관리자모드</option>
          <option value="center">📊 센터장 (박경숙 상무)</option>
          <option value="bm2">🔵 BM2본부장 (이진기)</option>
          <option value="bm3">🟣 BM3본부장 (김윤섭)</option>
          <option value="bm2_2">👥 BM2-2팀장 (김혜윰)</option>
          <option value="bm2_3">👥 BM2-3팀장 (김소현)</option>
          <option value="bm3_2">👥 BM3-2팀장 (안상민)</option>
        </select>
      </div>
      <div class="login-field">
        <label>비밀번호</label>
        <input type="password" id="pwInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>
<!-- 인원 관리 모달 -->
<div id="memberMgmtModal" style="display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;margin:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="font-size:16px;font-weight:700;">⚙️ 인원 관리</h2>
      <button onclick="closeMemberMgmt()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sub);">✕</button>
    </div>
    <div style="background:var(--surface2);border-radius:12px;padding:16px;margin-bottom:16px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:12px;color:#3949ab;">➕ 인원 추가</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">본부</label><select id="addBU" onchange="updateAddTeamOptions()" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"><option value="">본부 선택</option></select></div>
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">팀</label><select id="addTeam" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"><option value="">팀 선택</option></select></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">이름</label><input id="addName" type="text" placeholder="홍길동" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">구글 시트 ID</label><input id="addSheetId" type="text" placeholder="스프레드시트 ID 붙여넣기" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">직급</label><input id="addTitle" type="text" placeholder="예: 대리, 사원" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
        <div><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">입사일</label><input id="addJoinDate" type="text" placeholder="예: 2024-03-15" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
      </div>
      <div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-sub);display:block;margin-bottom:4px;">사번 <span style="color:#c62828;">(로그인 ID · 초기 비밀번호)</span></label><input id="addEmpId" type="text" placeholder="예: B260315" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;"></div>
      <button onclick="addMember()" style="background:linear-gradient(135deg,#3949ab,#5c6bc0);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;width:100%;">➕ 추가하기</button>
      <div id="addMsg" style="font-size:12px;margin-top:8px;text-align:center;display:none;"></div>
    </div>
    <div>
      <div style="font-size:13px;font-weight:700;margin-bottom:12px;color:#c62828;">👥 현재 인원 목록</div>
      <div id="memberMgmtList" style="font-size:13px;color:var(--text-muted);text-align:center;padding:20px;">불러오는 중...</div>
    </div>
  </div>
</div>
<div id="dashScreen" style="display:none;">
  <div class="header">
    <div class="header-left">
      <h1>📊 미래아이엔씨 가망건 통합 대시보드 <span style="font-size:12px;opacity:.6;font-weight:400;">v5.13</span></h1>
      <div class="scope" id="headerScope">-</div>
    </div>
    <div class="header-right">
      <span class="user-chip" id="userChip">-</span>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 다크</button>
      <button class="theme-btn" onclick="openMemberMgmt()" title="인원 관리" style="font-size:16px;padding:5px 10px;">⚙️</button>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="container">
    <div style="display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--border);">
      <button id="mainTab_db"   onclick="switchMainTab('db')"   style="padding:10px 24px;border:none;background:none;font-size:14px;font-weight:700;color:#3949ab;border-bottom:3px solid #3949ab;cursor:pointer;margin-bottom:-2px;">📋 광고주DB</button>

function fmt(v){const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));return isNaN(n)?'-':Math.round(n).toLocaleString('ko-KR');}
function fmtB(v){if(!v||v<=0)return'-';return Math.round(v/10000).toLocaleString('ko-KR')+'만원';}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function normalizeDate(d){if(!d)return'';const s=String(d).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m1=s.match(/^(\d{4})\s*[.\/]\s*(\d{1,2})\s*[.\/]\s*(\d{1,2})\s*$/);if(m1)return`${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;const m2=s.match(/^(\d{2})\s*[.\/]\s*(\d{1,2})\s*[.\/]\s*(\d{1,2})\s*$/);if(m2)return`20${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;return s;}
function fmtDateDisp(d){const n=normalizeDate(d||'');if(!n||n==='-')return'-';const m=n.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return m[1]+'.'+m[2]+'.'+m[3];return n;}
function fmtRecallDate(dateStr){if(!dateStr)return'-';const m=String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return`${m[1].slice(2)}/${parseInt(m[2])}/${parseInt(m[3])}`;return dateStr;}
function gradeBadge(g){const map={'선택없음':'gb-none','단순재콜':'gb-recall','단기':'gb-short','장기':'gb-long','권한오픈':'gb-open','권한+브리핑':'gb-briefing','메일전송':'gb-mail','이관완료':'gb-done'};const c=map[g]||'gb-none';return`<span class="grade-badge ${c}">${g||'선택없음'}</span>`;}
function gradeBadgeEx(g,changed){const map={'선택없음':'gb-none','단순재콜':'gb-recall','단기':'gb-short','장기':'gb-long','권한오픈':'gb-open','권한+브리핑':'gb-briefing','메일전송':'gb-mail','이관완료':'gb-done'};const c=map[g]||'gb-none';const icon=changed?`<span title="최근 등급 변경됨" style="margin-left:3px;font-size:10px;">🔄</span>`:'';return`<span class="grade-badge ${c}">${g||'선택없음'}${icon}</span>`;}
function buBadge(b){return`<span class="bu-badge ${b==='BM2본부'?'bb-bm2':'bb-bm3'}">${b}</span>`;}
function rankIcon(i){return['🥇','🥈','🥉'][i]||(i+1)+'위';}

function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='err'?'#c62828':'#1b5e20';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function loading(show,txt='불러오는 중...'){document.getElementById('ltxt').textContent=txt;document.getElementById('lov').classList.toggle('show',show);}
function toggleC(id){const b=document.getElementById(id),a=document.getElementById(id+'A');const c=b.classList.toggle('collapsed');if(a)a.style.transform=c?'rotate(-90deg)':'rotate(0deg)';}

function renderRecallChips(recalls){
  if(!recalls||!recalls.length)return'<span style="color:var(--text-muted);">-</span>';
  const td2=today();
  const sorted=[...recalls].filter(rc=>{const d=typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'';if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return true;return d<=td2;}).sort((a,b)=>{const da=typeof a==='object'?(a.date||''):normalizeDate(String(a).slice(0,10))||'';const db=typeof b==='object'?(b.date||''):normalizeDate(String(b).slice(0,10))||'';return db.localeCompare(da);});
  const makeChip=rc=>{let dateStr='',memo='';if(typeof rc==='object'&&rc!==null){dateStr=rc.date||'';memo=rc.memo||'';}else{dateStr=String(rc);}const label=fmtRecallDate(dateStr);if(!memo)return`<span style="display:inline-block;font-size:11px;background:var(--surface2);border:0.5px solid var(--border);border-radius:5px;padding:2px 7px;margin:1px 2px;color:var(--text-sub);">${label}</span>`;return`<span class="recall-tip"><span style="display:inline-block;font-size:11px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 8px;margin:1px 2px;color:#1565c0;font-weight:600;cursor:help;">${label} 💬</span><span class="tip-content">${memo.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</span></span>`;};
  if(sorted.length<=5)return sorted.map(makeChip).join('');
  const uid='rc_'+Math.random().toString(36).slice(2,7);
  const first5=sorted.slice(0,5).map(makeChip).join('');
  const rest=sorted.slice(5).map(makeChip).join('');
  const extra=sorted.length-5;
  return`<span>${first5}<span id="rc_more_${uid}"><span onclick="toggleRecallMore('${uid}')" style="display:inline-block;font-size:11px;color:#1565c0;cursor:pointer;font-weight:600;margin-left:2px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 7px;">+${extra} 더보기 ▼</span></span><span id="rc_rest_${uid}" style="display:none;">${rest}<span onclick="toggleRecallMore('${uid}')" style="display:inline-block;font-size:11px;color:#1565c0;cursor:pointer;font-weight:600;margin-left:2px;background:#e8f4fd;border:1px solid #90caf9;border-radius:5px;padding:2px 7px;">▲ 접기</span></span></span>`;
}
function toggleRecallMore(uid){const more=document.getElementById('rc_more_'+uid);const rest=document.getElementById('rc_rest_'+uid);if(!more||!rest)return;const h=rest.style.display==='none';more.style.display=h?'none':'inline';rest.style.display=h?'inline':'none';}

// ── 메인 탭 전환 ─────────────────────────────
let CURRENT_MAIN_TAB='db';
let PERF_DATA=null;
const LS_PERF_TTL=30*60*1000;
function _lsPerfKey(role,year,month){return'perf_'+LS_VER+'_'+role+'_'+year+'_'+month;}
function lsPerfSave(role,year,month,data){try{localStorage.setItem(_lsPerfKey(role,year,month),JSON.stringify({ts:Date.now(),data}));}catch(e){}}

async function loadPerformance(forceRefresh){
  if(!SESSION)return;
  const area=document.getElementById('perfContent');if(!area)return;

  area.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-sub);">📊 성과 데이터 불러오는 중...<br><small style="font-size:11px;color:var(--text-muted);">처음 로드 시 10~20초 소요될 수 있습니다</small></div>';
  try{
    const res=await callServer('serverGetPerformance',{role:SESSION.role,token:SESSION.token,year:PERF_YEAR,month:PERF_MONTH});
    if(!res.success){if((res.error||'').includes('fetch')){setTimeout(()=>loadPerformance(),2000);area.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-sub);">🔄 재연결 중...</div>';return;}area.innerHTML='<div style="padding:40px;text-align:center;color:#c62828;">⚠️ '+res.error+'<br><button onclick="loadPerformance(true)" style="margin-top:12px;padding:8px 20px;border-radius:8px;border:1px solid #c62828;background:#fce4ec;color:#c62828;cursor:pointer;">🔄 다시 시도</button></div>';return;}
    lsPerfSave(SESSION.role,PERF_YEAR,PERF_MONTH,res);PERF_DATA=res;renderPerformance(res);
  }catch(e){area.innerHTML='<div style="padding:40px;text-align:center;color:#c62828;">⚠️ '+e.message+'<br><button onclick="loadPerformance(true)" style="margin-top:12px;padding:8px 20px;border-radius:8px;border:1px solid #c62828;background:#fce4ec;color:#c62828;cursor:pointer;">🔄 다시 시도</button></div>';}
}

function renderPerformance(res){
  const area=document.getElementById('perfContent');if(!area)return;
  const fmtW=n=>n>=100000000?(n/100000000).toFixed(1)+'억':n>=10000?(n/10000).toFixed(0)+'만':String(n);
  const results=res.results||[];const now=new Date();let monthOpts='';
  for(let y=now.getFullYear();y>=2025;y--){const maxM=y===now.getFullYear()?now.getMonth()+1:12;for(let m=maxM;m>=1;m--){const sel=(y===PERF_YEAR&&m===PERF_MONTH)?' selected':'';monthOpts+=`<option value="${y}-${m}"${sel}>${y}년 ${m}월</option>`;}}
  const ranked=[...results].filter(r=>!r.noSheet&&!r.error).sort((a,b)=>b.totalSales-a.totalSales);
  const rankRows=ranked.map((r,i)=>{const bar=ranked[0]?.totalSales>0?Math.round(r.totalSales/ranked[0].totalSales*100):0;return`<tr><td style="padding:8px 12px;font-weight:700;color:#3949ab;">${i+1}위</td><td style="padding:8px 12px;">${r.name}</td><td style="padding:8px 12px;font-size:11px;color:var(--text-sub);">${r.bu} ${r.team}</td><td style="padding:8px 12px;font-weight:700;">${fmtW(r.totalSales)}</td><td style="padding:8px 12px;"><div style="background:var(--surface2);border-radius:4px;height:8px;width:120px;"><div style="background:#3949ab;height:8px;border-radius:4px;width:${bar}%;"></div></div></td><td style="padding:8px 12px;color:${r.achieveRate>=100?'#2e7d32':'#e65100'};">${r.achieveRate}%</td></tr>`;}).join('');
  const cards=results.map(r=>{if(r.noSheet)return`<div class="sec" style="opacity:0.7;"><div class="sec-hd">${r.name} <span style="font-size:11px;color:#e65100;">- 월간실적 탭 없음</span></div></div>`;if(r.error)return`<div class="sec" style="opacity:0.5;"><div class="sec-hd">${r.name} <span style="font-size:11px;color:#c62828;">- 오류: ${r.error}</span></div></div>`;const achColor=r.achieveRate>=100?'#2e7d32':r.achieveRate>=70?'#e65100':'#c62828';return`<div class="sec"><div class="sec-hd sh-b" style="margin-bottom:14px;">${r.name} <span style="font-size:11px;font-weight:400;color:var(--text-sub);">${r.bu} ${r.team}</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;"><div class="card"><div class="card-lbl">🎯 목표매출</div><div class="card-val" style="font-size:18px;">${fmtW(r.targetSales)}</div></div><div class="card"><div class="card-lbl">💰 현재매출</div><div class="card-val cv-blue" style="font-size:18px;">${fmtW(r.totalSales)}</div><div class="card-sub">달성률 <b style="color:${achColor}">${r.achieveRate}%</b></div></div><div class="card"><div class="card-lbl">📈 예상매출</div><div class="card-val cv-orange" style="font-size:18px;">${fmtW(r.projectedSales||0)}</div><div class="card-sub">예상달성률 <b>${r.projectedRate||0}%</b></div></div><div class="card"><div class="card-lbl">📞 콜 건수</div><div class="card-val cv-blue">${r.totalCalls}건</div></div><div class="card"><div class="card-lbl">✅ 이관건수</div><div class="card-val cv-green">${r.totalTransfers}건</div></div><div class="card"><div class="card-lbl">💵 이관매출</div><div class="card-val cv-green">${fmtW(r.totalTransferSales)}</div></div></div></div>`;}).join('');
  area.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;"><select onchange="changePerfMonth(this.value)" style="padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;">${monthOpts}</select><span style="font-size:13px;color:var(--text-sub);">영업일 ${res.totalWorkDaysInMonth}일 기준</span></div><div class="sec"><div class="sec-hd sh-b" style="margin-bottom:12px;">🏆 전사원 매출 현황 (${PERF_YEAR}년 ${PERF_MONTH}월)</div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:var(--th-bg);color:var(--th-color);"><th style="padding:8px 12px;">순위</th><th style="padding:8px 12px;">이름</th><th style="padding:8px 12px;">소속</th><th style="padding:8px 12px;">현재매출</th><th style="padding:8px 12px;">달성률 바</th><th style="padding:8px 12px;">달성률</th></tr></thead><tbody>${rankRows}</tbody></table></div></div>${cards}`;
}

// ── _applyData ────────────────────────────────
function _applyData(res){
  CURRENT_ROWS=res.rows||[];
  CURRENT_FILTER='all';
  MEMBER_NAV_ACTIVATED=false;
  RECENT_GRADE_CHANGES=res.recentGradeChanges||[];
  if(res.orgMap)Object.assign(ORG_MAP,res.orgMap);
  if(res.sheetMap)Object.assign(SHEET_MAP,res.sheetMap);
  if(res.roleInfo){
    SESSION.roleInfo=res.roleInfo;
    const ri=res.roleInfo;
    const el=document.getElementById('userChip');
    if(el)el.textContent=`${ri.name} ${ri.title||''}${ri.joinDate?` (${ri.joinDate.slice(0,7)})`:''}`; 
    sessionStorage.setItem('dash_session',JSON.stringify(SESSION));
  }
  buildNav(calcClientStats(CURRENT_ROWS));
  renderDash(calcClientStats(CURRENT_ROWS),res.roleInfo);

}

async function loadData(forceRefresh=false){
  if(forceRefresh)lsClear(SESSION.role);
  if(!forceRefresh){
    const cached=lsLoad(SESSION.role);
    if(cached&&cached.success){
      _applyData(cached);loadSalesData(SALES_MONTH||'');loading(false);
      toast('⚡ 빠른 로드 완료 (백그라운드 갱신 중...)');
      callServer('serverData',{role:SESSION.role,token:SESSION.token,forceRefresh:false})
        .then(res=>{if(!res.success)return;lsSave(SESSION.role,res);if((res.rows||[]).length!==CURRENT_ROWS.length){_applyData(res);loadSalesData(SALES_MONTH||'');toast('✅ 데이터 갱신 완료');}})
        .catch(()=>{});
      return;
    }
  }
  loading(true,forceRefresh?'🔄 최신 데이터 불러오는 중...':'📡 데이터 불러오는 중...');
  try{
    const res=await callServer('serverData',{role:SESSION.role,token:SESSION.token,forceRefresh});
    if(!res.success){if(res.error.includes('세션'))doLogout();throw new Error(res.error);}
    lsSave(SESSION.role,res);_applyData(res);loadSalesData(SALES_MONTH||'');
    toast('✅ 데이터 로드 완료!'+(res._cached?' (서버캐시)':''));
    setTimeout(prefetchPerformance,3000);
  }catch(e){toast('❌ '+e.message,'err');}
  finally{loading(false);}
}

function refreshData(){if(SESSION){lsClear(SESSION.role);loadData(true);}}

// ── 로그인 / 로그아웃 ─────────────────────────
async function doLogin(){
  const roleEl=document.getElementById('roleSelect');
  const pwEl=document.getElementById('pwInput');
  const errEl=document.getElementById('loginError');
  const loginBtn=document.getElementById('loginBtn');
  const role=roleEl?roleEl.value:'';
  const pw=pwEl?pwEl.value:'';
  errEl.classList.remove('show');
  if(!role){errEl.textContent='역할을 선택해주세요.';errEl.classList.add('show');return;}
  if(!pw){errEl.textContent='비밀번호를 입력해주세요.';errEl.classList.add('show');return;}
  loginBtn.disabled=true;loginBtn.textContent='인증 중...';loading(true,'🔐 인증 중...');
  try{
    const res=await callServer('serverAuth',{role,password:pw});
    if(!res.success){errEl.textContent=res.error||'인증 실패';errEl.classList.add('show');return;}
    SESSION={role:res.role,token:res.token,roleInfo:res.roleInfo,scope:res.scope};
    sessionStorage.setItem('dash_session',JSON.stringify(SESSION));
    showDash();await loadData();
  }catch(e){errEl.textContent='연결 오류: '+e.message;errEl.classList.add('show');}
  finally{loginBtn.disabled=false;loginBtn.textContent='로그인';loading(false);}
}

function doLogout(){
  SESSION=null;sessionStorage.removeItem('dash_session');
  document.getElementById('dashScreen').style.display='none';
  document.getElementById('loginScreen').style.display='block';
  document.getElementById('pwInput').value='';
  document.getElementById('roleSelect').value='';
  CURRENT_ROWS=[];window._promoReady=false;
  window.COMPARE_DATA=null;window.COMPARE_DATA_LOADING=false;
}

function showDash(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('dashScreen').style.display='block';
  const ri=SESSION.roleInfo;
  document.getElementById('userChip').textContent=`${ri.name} ${ri.title||''}${ri.joinDate?` (${ri.joinDate.slice(0,7)})`:''}`; 
  document.getElementById('headerScope').textContent=(ri.scope||'내 가망건')+' | '+new Date().toLocaleString('ko-KR');
  initYearSelect();
}

// ── 네비게이션 ─────────────────────────────────
function buildNav(stats){
  const role=SESSION.role;const buMap={},teamMap={};
  (stats.buStats||[]).forEach(b=>buMap[b.bu]=b);(stats.teamStats||[]).forEach(t=>teamMap[t.team]=t);
  const topEl=document.getElementById('navRowTop');const botEl=document.getElementById('navRowBottom');
  const divEl=document.getElementById('navDivider');const navWrap=document.getElementById('navWrap');
  let topHtml='',botHtml='';
  if(role==='center'||role==='관리자모드'||role==='master'){
    navWrap.style.display='block';
    topHtml=`<span class="nav-lbl">📌</span><button class="nbtn ${CURRENT_FILTER==='all'?'na':''}" onclick="filterView('all')">🏆 전체</button>`;
    BU_ORDER.forEach(bu=>{if(!ORG_MAP[bu])return;const total=buMap[bu]?.total||0;const isBm2=bu==='BM2본부';topHtml+=`<button class="nbtn ${CURRENT_FILTER===bu?(isBm2?'na-bm2':'na-bm3'):''}" onclick="filterView('${bu}')">${isBm2?'🔵':'🟣'} ${bu}(${total})</button>`;TEAM_ORDER.filter(t=>t.startsWith(isBm2?'BM2':'BM3')).forEach(team=>{const tt=teamMap[team];if(!tt)return;topHtml+=`<button class="nbtn ${CURRENT_FILTER===team?'na-team':''}" onclick="filterView('${team}')">👥 ${team}(${tt.total})</button>`;});});
    botHtml=buildMemberNav(CURRENT_FILTER);
  }else if(role==='bm2'||role==='bm3'){
    navWrap.style.display='block';
    const myBU=role==='bm2'?'BM2본부':'BM3본부';
    const myTeams=TEAM_ORDER.filter(t=>t.startsWith(role==='bm2'?'BM2':'BM3'));
    topHtml=`<span class="nav-lbl">📌</span><button class="nbtn ${CURRENT_FILTER==='all'?'na':''}" onclick="filterView('all')">전체</button>`;
    myTeams.forEach(team=>{const tt=teamMap[team];if(!tt)return;topHtml+=`<button class="nbtn ${CURRENT_FILTER===team?'na-team':''}" onclick="filterView('${team}')">👥 ${team}(${tt.total})</button>`;});
    botHtml=buildMemberNav(CURRENT_FILTER,myBU);
  }else if(['bm2_2','bm2_3','bm3_2'].includes(role)){
    navWrap.style.display='block';
    const teamName=role==='bm2_2'?'BM2-2팀':role==='bm2_3'?'BM2-3팀':'BM3-2팀';
    const bu=role.startsWith('bm2')?'BM2본부':'BM3본부';
    topHtml=`<span class="nav-lbl">📌</span><button class="nbtn ${CURRENT_FILTER==='all'?'na':''}" onclick="filterView('all')">👥 ${teamName} 전체</button>`;
    botHtml=`<span class="nav-lbl">👤</span>`;
    (ORG_MAP[bu]?.[teamName]||[]).forEach(name=>{botHtml+=`<button class="nbtn ${CURRENT_FILTER===name?'na-member':''}" onclick="filterView('${name}')">👤 ${name}</button>`;});
  }else{navWrap.style.display='none';return;}
  topEl.innerHTML=topHtml;botEl.innerHTML=botHtml;divEl.style.display=botHtml?'block':'none';
}

function buildMemberNav(filter,forceBU){
  if(!MEMBER_NAV_ACTIVATED)return'';
  const allNames=Object.values(ORG_MAP).flatMap(bu=>Object.values(bu).flat());
  const isMember=allNames.includes(filter);let members=[];
  if(filter==='all'){BU_ORDER.forEach(bu=>{if(forceBU&&bu!==forceBU)return;if(!ORG_MAP[bu])return;TEAM_ORDER.filter(t=>t.startsWith(bu==='BM2본부'?'BM2':'BM3')).forEach(team=>{(ORG_MAP[bu][team]||[]).forEach(name=>members.push({name,bu,team}));});});}
  else if(isMember){for(const bu in ORG_MAP)for(const team in ORG_MAP[bu])if(ORG_MAP[bu][team].includes(filter)){(ORG_MAP[bu][team]||[]).forEach(name=>members.push({name,bu,team}));break;}}
  else if(ORG_MAP[filter]){TEAM_ORDER.filter(t=>t.startsWith(filter==='BM2본부'?'BM2':'BM3')).forEach(team=>{(ORG_MAP[filter][team]||[]).forEach(name=>members.push({name,bu:filter,team}));});}
  else{for(const bu in ORG_MAP){if(ORG_MAP[bu][filter]){(ORG_MAP[bu][filter]||[]).forEach(name=>members.push({name,bu,team:filter}));break;}}}
  if(!members.length)return'';
  let html=`<span class="nav-lbl">👤</span>`;let lastTeam='';
  members.forEach(({name,team,bu})=>{
    if(team!==lastTeam){if(lastTeam)html+=`<span style="color:var(--border);margin:0 4px;">│</span>`;lastTeam=team;}
    const colorClass=CURRENT_FILTER===name?'na-member':(bu==='BM2본부'?'mbr-bm2':'mbr-bm3');
    const sheetId=SHEET_MAP[name]||'';
    const sheetBtn=sheetId?`<a href="https://docs.google.com/spreadsheets/d/${sheetId}" target="_blank" title="${name} 시트" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;font-size:12px;text-decoration:none;margin-left:2px;vertical-align:middle;" onclick="event.stopPropagation()">📊</a>`:'';
    html+=`<span style="display:inline-flex;align-items:center;gap:2px;"><button class="nbtn ${colorClass}" onclick="filterView('${name}')">👤 ${name}</button>${sheetBtn}</span>`;
  });
  return html;
}

function filterView(filter){
  CURRENT_FILTER=filter;MEMBER_NAV_ACTIVATED=true;
  const allNames=Object.values(ORG_MAP).flatMap(bu=>Object.values(bu).flat());
  const isMember=allNames.includes(filter);
  const filtered=filter==='all'?CURRENT_ROWS:isMember?CURRENT_ROWS.filter(r=>r.manager===filter):CURRENT_ROWS.filter(r=>r.bu===filter||r.team===filter);
  renderDash(calcClientStats(filtered),SESSION.roleInfo,filtered);buildNav(calcClientStats(CURRENT_ROWS));
}

// ── 날짜 필터 ─────────────────────────────────
function applyYearMonth(){
  const year=document.getElementById('selYear')?.value||'';const month=document.getElementById('selMonth')?.value||'';if(!year)return;
  const pad=n=>String(n).padStart(2,'0');let from='',to='';
  if(month){const lastDay=new Date(parseInt(year),parseInt(month),0).getDate();from=`${year}-${month}-01`;to=`${year}-${month}-${pad(lastDay)}`;}
  else{from=`${year}-01-01`;to=`${year}-12-31`;}
  DATE_FROM=from;DATE_TO=to;
  const df=document.getElementById('dateFrom');const dt=document.getElementById('dateTo');if(df)df.value=from;if(dt)dt.value=to;
  const info=document.getElementById('dateFilterInfo');if(info)info.textContent=month?`${year}년 ${parseInt(month)}월`:`${year}년 전체`;
  updateQuickBtnState('');filterView(CURRENT_FILTER);

function initYearSelect(){const sel=document.getElementById('selYear');if(!sel)return;const cur=new Date().getFullYear();let opts='<option value="">연도</option>';for(let y=cur;y>=cur-3;y--)opts+=`<option value="${y}">${y}년</option>`;sel.innerHTML=opts;}
function applyDateFilter(){DATE_TO=document.getElementById('dateTo')?.value||'';updateQuickBtnState('');const info=document.getElementById('dateFilterInfo');if(info){if(DATE_FROM||DATE_TO)info.textContent=`${DATE_FROM||'시작'}~${DATE_TO||'현재'} 필터 중`;else info.textContent='';}filterView(CURRENT_FILTER);}
function setQuickDate(range){const now=new Date();const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;let from='',to='',btnId='';if(range==='today'){from=fmt(now);to=fmt(now);btnId='qbToday';}else if(range==='yesterday'){const y=new Date(now);y.setDate(y.getDate()-1);from=fmt(y);to=fmt(y);btnId='qbYesterday';}else{const d=new Date(now);d.setDate(d.getDate()-(range-1));from=fmt(d);to=fmt(now);btnId=range===7?'qb7':range===15?'qb15':'qb30';}DATE_FROM=from;DATE_TO=to;const df=document.getElementById('dateFrom');const dt=document.getElementById('dateTo');if(df)df.value=from;if(dt)dt.value=to;const info=document.getElementById('dateFilterInfo');if(info)info.textContent=`${from}~${to}`;updateQuickBtnState(btnId);filterView(CURRENT_FILTER);}
function updateQuickBtnState(activeId){['qbToday','qbYesterday','qb7','qb15','qb30'].forEach(id=>{const el=document.getElementById(id);if(!el)return;if(id===activeId)el.classList.add('na');else el.classList.remove('na');});}
function resetDateFilter(){DATE_FROM='';DATE_TO='';const df=document.getElementById('dateFrom');const dt=document.getElementById('dateTo');if(df)df.value='';if(dt)dt.value='';const sy=document.getElementById('selYear');const sm=document.getElementById('selMonth');if(sy)sy.value='';if(sm)sm.value='';const info=document.getElementById('dateFilterInfo');if(info)info.textContent='';updateQuickBtnState('');filterView(CURRENT_FILTER);}

// ── 통계 계산 ─────────────────────────────────
function calcClientStats(rows){
  const td=today();let filteredByDate=rows;
  if(DATE_FROM||DATE_TO){filteredByDate=rows.filter(r=>{const norm=normalizeDate(r.firstCall)||'';let maxD=norm;if(r.recalls&&r.recalls.length){r.recalls.forEach(rc=>{const d=typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'';if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d>maxD)maxD=d;});}const latestDate=maxD||norm;if(DATE_FROM&&latestDate<DATE_FROM)return false;if(DATE_TO&&latestDate>DATE_TO)return false;return true;});}
  const activeRows=filteredByDate.filter(r=>!EXCLUDE_GRADES.includes(r.grade));
  const gradeMap={},memberMap={},teamMap={},buMap={};
  const bands={'50만원 미만':{min:0,max:500000,count:0,total:0},'50-100만원':{min:500000,max:1000000,count:0,total:0},'100-300만원':{min:1000000,max:3000000,count:0,total:0},'300-500만원':{min:3000000,max:5000000,count:0,total:0},'500만원 이상':{min:5000000,max:Infinity,count:0,total:0}};
  const contactMap={};
  activeRows.forEach(r=>{const g=r.grade||'미분류';gradeMap[g]=(gradeMap[g]||0)+1;if(!memberMap[r.manager])memberMap[r.manager]={name:r.manager,team:r.team,bu:r.bu,title:r.title||'',joinDate:r.joinDate||'',total:0,grades:{}};memberMap[r.manager].total++;memberMap[r.manager].grades[g]=(memberMap[r.manager].grades[g]||0)+1;if(!teamMap[r.team])teamMap[r.team]={team:r.team,bu:r.bu,total:0,grades:{}};teamMap[r.team].total++;teamMap[r.team].grades[g]=(teamMap[r.team].grades[g]||0)+1;if(!buMap[r.bu])buMap[r.bu]={bu:r.bu,total:0,grades:{}};buMap[r.bu].total++;buMap[r.bu].grades[g]=(buMap[r.bu].grades[g]||0)+1;if(r.budget>0)for(const b in bands)if(r.budget>=bands[b].min&&r.budget<bands[b].max){bands[b].count++;bands[b].total+=r.budget;break;}const cp=r.contactPoint||'미분류';if(!contactMap[r.manager])contactMap[r.manager]={name:r.manager,team:r.team,bu:r.bu,points:{}};contactMap[r.manager].points[cp]=(contactMap[r.manager].points[cp]||0)+1;});
  const missedRecalls=rows.filter(r=>r.missedRecallDate&&r.missedRecallDate<td).map(r=>({...r,nextRecallDate:r.missedRecallDate})).sort((a,b)=>(b.nextRecallDate||'').localeCompare(a.nextRecallDate||''));
  const todayRecalls=rows.filter(r=>r.nextRecallDate&&r.nextRecallDate===td);
  const d10=new Date();d10.setDate(d10.getDate()-10);const since10=d10.getFullYear()+'-'+String(d10.getMonth()+1).padStart(2,'0')+'-'+String(d10.getDate()).padStart(2,'0');
  const recentTransfers=rows.filter(r=>r.grade==='이관완료'&&(r.firstCall||'')>=since10).sort((a,b)=>(b.firstCall||'').localeCompare(a.firstCall||''));
  const sortedTeams=TEAM_ORDER.filter(t=>teamMap[t]).map(t=>teamMap[t]);
  const sortedBUs=BU_ORDER.filter(b=>buMap[b]).map(b=>buMap[b]);
  return{total:activeRows.length,totalAll:filteredByDate.length,totalBudget:activeRows.reduce((s,r)=>s+r.budget,0),gradeMap,memberStats:Object.values(memberMap).sort((a,b)=>b.total-a.total),budgetBands:bands,todayRecalls,missedRecalls,recentTransfers,contactStats:Object.values(contactMap),teamStats:sortedTeams,buStats:sortedBUs};
}

// ── 업종별 매출 ───────────────────────────────

// ── 나의 가망건 비교 차트 ─────────────────────
function renderMemberCompareCharts(){
  if(!SESSION||!SESSION.roleInfo)return'';
  const ri=SESSION.roleInfo;const myName=ri.name||'';
  const GRADE_KEYS=['단기','장기','권한오픈','권한+브리핑','이관완료'];
  const GRADE_COLORS={'단기':'#e65100','장기':'#c62828','권한오픈':'#6a1b9a','권한+브리핑':'#1565c0','이관완료':'#2e7d32','미분류':'#9e9e9e'};

  // ── CURRENT_ROWS 기반 클라이언트 계산 (날짜 필터 반영) ──
  let filteredRows=CURRENT_ROWS;
  if(DATE_FROM||DATE_TO){
    filteredRows=CURRENT_ROWS.filter(r=>{
      const norm=normalizeDate(r.firstCall)||'';let maxD=norm;
      if(r.recalls&&r.recalls.length){r.recalls.forEach(rc=>{const d=typeof rc==='object'?normalizeDate(rc.date)||'':normalizeDate(String(rc).slice(0,10))||'';if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d>maxD)maxD=d;});}
      const latestDate=maxD||norm;
      if(DATE_FROM&&latestDate<DATE_FROM)return false;
      if(DATE_TO&&latestDate>DATE_TO)return false;
      return true;
    });
  }
  const active=filteredRows.filter(r=>!EXCLUDE_GRADES.includes(r.grade));

  // 전체 인원 평균 (담당자별 집계)
  const memberMap={};
  active.forEach(r=>{

  };

  const doneDonut=()=>{const cnt=myDone.length;if(cnt===0)return'<div style="text-align:center;flex:1;min-width:160px;"><svg width="130" height="130" viewBox="0 0 130 130" style="display:block;margin:0 auto;"><circle cx="65" cy="65" r="50" fill="none" stroke="var(--surface2)" stroke-width="16"/><text x="65" y="70" text-anchor="middle" font-size="12" fill="var(--text-sub)">0건</text></svg><div style="font-size:13px;font-weight:700;margin-top:6px;">이관완료</div><div style="font-size:11px;color:var(--text-sub);">기간 내 0건</div></div>';return'<div style="text-align:center;flex:1;min-width:160px;"><svg width="130" height="130" viewBox="0 0 130 130" style="display:block;margin:0 auto;"><circle cx="65" cy="65" r="50" fill="none" stroke="#2e7d32" stroke-width="16"/><text x="65" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#2e7d32">'+cnt+'</text><text x="65" y="76" text-anchor="middle" font-size="10" fill="var(--text-sub)">건</text></svg><div style="font-size:13px;font-weight:700;margin-top:4px;">이관완료</div><div style="font-size:11px;color:var(--text-sub);">기간 내 '+cnt+'건</div></div>';};

function gcQuick(range){const now=new Date();const pad=n=>String(n).padStart(2,'0');const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());let from='',to=fmt(now);if(range==='today'){from=fmt(now);}else if(range==='yesterday'){const y=new Date(now);y.setDate(y.getDate()-1);from=fmt(y);to=fmt(y);}else if(range==='all'){from='';to='';}else{const d=new Date(now);d.setDate(d.getDate()-(range-1));from=fmt(d);}const fromEl=document.getElementById('gcFrom');const toEl=document.getElementById('gcTo');if(fromEl)fromEl.value=from;if(toEl)toEl.value=to;['gcQToday','gcQYest','gcQ7','gcQAll'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const map={gcQToday:'today',gcQYest:'yesterday',gcQ7:7,gcQAll:'all'};el.classList.toggle('na',map[id]===range);});gcApplyFilter();}

function _promoRoundSW(id){const data=_PR&&_PR[_PRbu];const list=Array.isArray(data)?data:(data&&_PRteam?data[_PRteam]:[]);const p=(list||[]).find(x=>x.id===id);if(p){_PRpromo=p;_promoLoad(p);}}
function _promoLoad(promo){const el=document.getElementById('promoContent');if(!el)return;el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sub);"><div style="width:28px;height:28px;border:3px solid var(--border);border-top-color:#3949ab;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;"></div>불러오는 중...</div>';fetch(promo.file+'?t='+Date.now()).then(r=>{if(!r.ok)throw new Error('파일을 불러올 수 없습니다 ('+r.status+')');return r.text();}).then(html=>{el.innerHTML='';const iframe=document.createElement('iframe');iframe.style.cssText='width:100%;border:none;display:block;min-height:200px;';iframe.scrolling='no';el.appendChild(iframe);iframe.srcdoc=html;iframe.addEventListener('load',function(){try{const body=iframe.contentDocument.body;iframe.style.height=(body.scrollHeight+40)+'px';const ro=new ResizeObserver(function(){try{iframe.style.height=(iframe.contentDocument.body.scrollHeight+40)+'px';}catch(e){}});ro.observe(body);}catch(e){iframe.style.height='800px';}});}).catch(e=>{el.innerHTML='<div style="text-align:center;padding:60px;color:#c62828;">❌ '+e.message+'</div>';});}
</script>
</body>
