<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능 일타 강사는 바로 나야 나! · 프로모션 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#faf6ec; --ink:#23262f; --ink2:#5b6070; --ink3:#8d91a0; --line:#e7e0cf; --card:#fffdf8;
  --pink:#e8457a; --pinkL:#fde3ec; --blue:#2f7fd1; --blueL:#dfeefc; --green:#2b9a59; --greenL:#ddf3e4; --yel:#c98a00; --yelL:#fff1c4;
  --hl:#ffe36b; --red:#e03b3b; --down:#2f6fd6;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;
  background-image:linear-gradient(rgba(120,150,190,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,190,.07) 1px,transparent 1px);background-size:26px 26px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.hand{font-family:'Gaegu',cursive;font-weight:700}
.jua{font-family:'Jua',sans-serif;font-weight:400}

/* HERO */
.hero{position:relative;text-align:center;padding:26px 10px 18px}
.hero h1{font-family:'Jua';font-weight:400;margin:0;line-height:1.08}
.hero h1 .l1{font-size:clamp(28px,4.6vw,50px);background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 8px}
.hero h1 .l2{display:inline-block;margin-top:6px;font-size:clamp(42px,7.6vw,86px);color:var(--pink);transform:rotate(-2deg);text-shadow:2px 3px 0 rgba(232,69,122,.15)}
.hero .l2u{display:block;width:min(520px,70%);height:7px;margin:2px auto 0;background:var(--pink);border-radius:8px;transform:rotate(-1.5deg);opacity:.85}
.hero h1.logo img{display:block;width:min(620px,88%);height:auto;margin:0 auto;animation:logoPop .8s cubic-bezier(.2,1.4,.4,1) both,logoFloat 4s ease-in-out .8s infinite}
@keyframes logoPop{from{opacity:0;transform:scale(.7) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes logoFloat{50%{transform:translateY(-6px) rotate(-.6deg)}}
.hero .sub{font-family:'Gaegu';font-weight:700;font-size:22px;margin-top:10px}
.note{position:absolute;font-family:'Gaegu';font-weight:700;font-size:19px;line-height:1.25;padding:12px 14px;box-shadow:0 6px 14px rgba(60,40,0,.12);text-align:center}
.note.n1{left:6px;top:24px;background:#fff;transform:rotate(-6deg);border:1px dashed #d8cfb9}
.note.dd{right:8px;top:16px;background:var(--pinkL);transform:rotate(5deg);min-width:150px}
.note.dd b{display:block;font-family:'Jua';font-weight:400;font-size:38px;color:var(--pink);line-height:1.05;margin-top:2px}
.note.dd small{display:block;font-size:15px;color:var(--ink2)}
.tape{position:absolute;top:-10px;left:50%;width:62px;height:20px;margin-left:-31px;background:rgba(255,227,107,.75);transform:rotate(-3deg)}
@media(max-width:900px){.note{position:static;display:inline-block;margin:10px 6px 0}.hero{display:flex;flex-direction:column;align-items:center}.note.n1{display:none}}

/* status line */
.status{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);margin:4px 0 14px}
.status .bar{width:180px;height:8px;background:#ece5d3;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin:0 6px}
.status .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#ff9a6b)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
.pill.local{background:#fff1c4;color:#8a6000}.pill.live{background:#ddf3e4;color:#1d7a44}.pill.off{background:#fde3e3;color:#b22}

/* NAV - book index tabs */
.nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 22px;border-bottom:2px solid #2a2d38;padding:0 6px}
.nav button{border:2px solid #2a2d38;border-bottom:none;background:#fff;padding:9px 16px 7px;border-radius:12px 12px 0 0;font-family:'Jua';font-size:17px;color:var(--ink);position:relative;top:2px}
.nav button.on{background:#2a2d38;color:#fff}
.nav button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.nav button.adm{margin-left:auto}
@media(max-width:700px){.nav button.adm{margin-left:0}.nav button{font-size:15px;padding:7px 11px 5px}}

/* cards */
.card{background:var(--card);border:1.5px solid #2a2d3822;border-radius:16px;box-shadow:0 2px 0 #2a2d3814,0 10px 24px rgba(70,50,10,.06);padding:18px 20px;position:relative}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.sec-title h2{font-family:'Jua';font-weight:400;font-size:26px;margin:0;background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 4px}
.sec-title .num{display:inline-flex;width:34px;height:34px;border-radius:50%;background:#1f3a6e;color:#fff;align-items:center;justify-content:center;font-family:'Jua';font-size:19px;align-self:center}
.sec-title .hint{font-family:'Gaegu';font-weight:700;color:var(--ink2);font-size:17px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid4,.grid2{grid-template-columns:1fr}}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr 0.9fr;gap:16px;align-items:end;padding-top:10px}
@media(max-width:800px){.podium{grid-template-columns:1fr 1fr;row-gap:30px}}
.pod{text-align:center;cursor:pointer;position:relative;will-change:transform}
.fig{position:relative;height:200px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:-14px;z-index:2;pointer-events:none}
.pod.r1 .fig{height:236px}
.pod.r4 .fig{height:170px}
.ph{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;position:relative;z-index:2;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);transform-origin:50% 100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.ph.ini{width:120px;height:120px;border-radius:50%;background:var(--tc);color:#fff;font-family:'Jua';font-size:40px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;-webkit-mask-image:none;mask-image:none}
.pod .who{background:#fff;border:2px solid var(--tc);border-radius:16px;padding:20px 10px 12px;position:relative;z-index:3;box-shadow:0 8px 18px rgba(0,0,0,.06)}
.pod .tn{display:inline-block;background:var(--tc);color:#fff;font-family:'Jua';font-size:15px;padding:2px 12px;border-radius:12px}
.pod .ld{font-family:'Jua';font-size:24px;margin:4px 0 0;line-height:1.1}
.pod .ld small{font-size:15px;color:var(--ink2)}
.pod .sc{font-family:'Jua';font-size:32px;color:var(--tc);line-height:1.1;margin-top:2px}
.pod .sc small{font-size:15px;color:var(--ink2)}
.pod .stand{margin-top:8px;border-radius:10px 10px 0 0;background:#2a2d38;color:#fff;font-family:'Jua';display:flex;align-items:center;justify-content:center;font-size:30px}
.pod.r1 .stand{height:110px;background:linear-gradient(#f6c945,#d99b00)} .pod.r2 .stand{height:80px;background:linear-gradient(#cfd6e2,#98a3b6)} .pod.r3 .stand{height:58px;background:linear-gradient(#e9b48a,#b9784a)} .pod.r4 .stand{height:34px;background:#cfc7b4;color:#6b6350;font-size:18px}
.pod.r1 .who{box-shadow:0 0 0 4px rgba(246,201,69,.45),0 12px 24px rgba(217,155,0,.25)}

/* rank 1: jump + crown + confetti + rays */
.pod.r1 .ph{animation:jump 1.8s cubic-bezier(.3,0,.3,1) infinite}
@keyframes jump{0%,55%,100%{transform:translateY(0) scale(1,1)}62%{transform:translateY(0) scale(1.04,.95)}75%{transform:translateY(-18px) scale(.98,1.03)}88%{transform:translateY(0) scale(1.03,.97)}}
.pod.r1 .crown{position:absolute;top:-8px;left:50%;font-size:46px;z-index:4;transform:translateX(-50%);animation:crownDrop .9s cubic-bezier(.3,1.6,.5,1) both,crownBob 1.8s cubic-bezier(.3,0,.3,1) .9s infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
@keyframes crownDrop{from{transform:translate(-50%,-90px) rotate(-30deg);opacity:0}to{transform:translate(-50%,0) rotate(-8deg);opacity:1}}
@keyframes crownBob{0%,55%,100%{transform:translate(-50%,0) rotate(-8deg)}75%{transform:translate(-50%,-18px) rotate(6deg)}}
.rays{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;z-index:0;opacity:.55;
  background:repeating-conic-gradient(rgba(255,210,63,.55) 0 10deg,transparent 10deg 24deg);-webkit-mask-image:radial-gradient(#000 25%,transparent 68%);mask-image:radial-gradient(#000 25%,transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;z-index:1;opacity:0;animation:fall 2.8s linear infinite}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(230px) rotate(540deg);opacity:0}}

/* rank 2, 3: sway */
.pod.r2 .ph{animation:sway 2.6s ease-in-out infinite}
.pod.r3 .ph{animation:sway 3s ease-in-out .4s infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

/* last: tremble + sweat */
.pod.last .ph{animation:tremble 2.4s linear infinite;filter:grayscale(.25) drop-shadow(0 6px 10px rgba(0,0,0,.18))}
@keyframes tremble{0%,60%,100%{transform:translateX(0)}63%{transform:translateX(-3px) rotate(-1deg)}66%{transform:translateX(3px) rotate(1deg)}69%{transform:translateX(-3px)}72%{transform:translateX(3px)}75%{transform:translateX(0)}}
.sweat{position:absolute;z-index:4;font-size:22px;opacity:0;animation:drip 2.4s ease-in infinite}
.sweat.s1{left:22%;top:18%}.sweat.s2{right:22%;top:24%;animation-delay:.8s;font-size:18px}.sweat.s3{right:14%;top:6%;animation-delay:1.5s;font-size:26px}
@keyframes drip{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(46px)}}

.flag{display:inline-block;margin-top:6px;font-family:'Gaegu';font-weight:700;font-size:16px;padding:1px 10px;border-radius:8px}
.flag.lead{background:var(--hl)}
.flag.bad{background:#ffe0e0;color:#c42727;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.stamp{position:absolute;right:-6px;top:-14px;border:3px solid var(--red);color:var(--red);font-family:'Jua';font-size:20px;padding:2px 10px;border-radius:8px;transform:rotate(14deg);background:rgba(255,255,255,.85)}
.stamp.slam{top:auto;bottom:40px;right:4px;z-index:5;font-size:26px;padding:4px 14px;border-width:4px;animation:slam .6s cubic-bezier(.5,1.8,.5,1) .6s both}
.stamp.slam.blue{border-color:var(--down);color:var(--down)}
@keyframes slam{from{transform:scale(3) rotate(30deg);opacity:0}to{transform:scale(1) rotate(14deg);opacity:1}}
.academy-ph{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:rgba(255,255,255,.9);border:3px solid var(--tc);float:left;margin:2px 12px 0 0}
@media(prefers-reduced-motion:reduce){.pod *,.rays,.cf,.sweat{animation:none!important}}

/* team score table */
table{border-collapse:collapse;width:100%}
.tbl th{font-size:12.5px;color:var(--ink2);font-weight:700;text-align:right;padding:8px 10px;border-bottom:2px solid #2a2d38;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.tbl .tot{font-family:'Jua';font-size:20px}
.scroll{overflow-x:auto}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.lock{display:inline-flex;align-items:center;gap:3px;color:var(--ink3);font-size:12.5px;background:#f1ece0;padding:1px 8px;border-radius:10px}
.prog{height:6px;background:#efe8d6;border-radius:4px;overflow:hidden;margin-top:4px;min-width:90px}
.prog i{display:block;height:100%;background:var(--tc,#2a2d38)}
.mini{font-size:11.5px;color:var(--ink3)}

/* area leaders */
.areaCard{border-radius:16px;padding:16px;border:2px solid var(--ac);background:var(--acL);position:relative}
.areaCard .ah{font-family:'Jua';font-size:22px;color:var(--ac)}
.areaCard .as{font-size:12.5px;color:var(--ink2);margin-top:-2px}
.areaCard .top{display:flex;align-items:center;gap:10px;margin-top:12px;background:#fff;border-radius:12px;padding:10px 12px}
.areaCard .top .nm{font-family:'Jua';font-size:21px}
.areaCard .top .v{margin-left:auto;font-family:'Jua';font-size:19px;color:var(--ac)}
.areaCard ol{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.areaCard ol li{display:flex;gap:8px;padding:3px 4px}
.areaCard ol li b{width:22px;color:var(--ink3)}
.areaCard ol li span.v{margin-left:auto;font-weight:700}
.icon{font-size:22px}

/* ranking list */
.rk{display:grid;grid-template-columns:52px 46px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.rk:hover{background:#fff7dc}
.rk .r{font-family:'Jua';font-size:19px}
.rk .ch{font-size:12.5px;font-weight:700}
.up{color:var(--red)}.dn{color:var(--down)}.eq{color:var(--ink3)}
.rk .nm{font-weight:700}
.rk .nm small{font-weight:500;color:var(--ink3);margin-left:4px}
.tteam{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px;color:#fff;margin-left:6px;vertical-align:1px}
.grs{display:flex;gap:4px;align-items:center}
.g{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;font-weight:900;font-size:12.5px;border:1.5px solid var(--ac);color:var(--ac);background:#fff}
.g.g1{background:var(--ac);color:#fff}
.g.g2{background:var(--acL)}
.rk .pt{font-family:'Jua';font-size:20px;min-width:62px;text-align:right}
.rk .pt small{font-size:12px;color:var(--ink3)}
.top3{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;align-items:end;margin-bottom:12px}
@media(max-width:700px){.top3{grid-template-columns:1fr}}
.t3{border-radius:16px;padding:16px 14px;text-align:center;cursor:pointer;background:var(--tcL);border:2px solid var(--tc);position:relative}
.t3 .medal{font-size:34px;line-height:1}
.t3 .nm{font-family:'Jua';font-size:26px;color:var(--tc);margin-top:4px}
.t3 .meta{font-size:12.5px;color:var(--ink2)}
.t3 .pt{font-family:'Jua';font-size:30px;margin-top:4px}
.t3.first{padding:24px 14px}
.t3.first .nm{font-size:32px}
.t3 .grs{justify-content:center;margin-top:8px}
.badge-edu{display:inline-block;background:#ffe0e0;color:#c42727;font-size:11px;font-weight:900;padding:1px 7px;border-radius:8px;margin-left:6px;animation:blink 1.2s infinite}

/* team academy */
.acad{border-top:7px solid var(--tc);padding:0;overflow:hidden}
.acad .board{background:#1f4a3d;color:#fff;padding:18px 20px 16px;position:relative;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:6px 6px}
.acad .board.c2{background-color:#173c5c}.acad .board.c3{background-color:#2b2a55}.acad .board.c4{background-color:#22504f}
.acad .board .tn{font-family:'Jua';font-size:15px;background:var(--tc);display:inline-block;padding:1px 12px;border-radius:10px}
.acad .board h3{font-family:'Jua';font-weight:400;font-size:28px;margin:6px 0 0}
.acad .board h3 small{font-family:'Gaegu';font-size:19px;opacity:.85;margin-left:6px}
.acad .board .big{position:absolute;right:20px;top:18px;text-align:right;font-family:'Jua'}
.acad .board .big b{font-size:40px;font-weight:400;line-height:1;display:block}
.acad .board .big span{font-size:14px;opacity:.8}
.acad .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acad .chips span{font-size:12px;background:rgba(255,255,255,.14);padding:2px 9px;border-radius:10px}
.acad .body{padding:6px 14px 14px}
.mrow{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px dashed var(--line);cursor:pointer}
.mrow:hover{background:#fff7dc}
.mrow .lead{font-size:10.5px;background:var(--tc);color:#fff;padding:1px 6px;border-radius:6px;margin-left:5px;font-weight:700}
.mrow .pt{font-family:'Jua';font-size:19px;min-width:54px;text-align:right}
.bonusbox{margin-top:10px;background:#f7f2e5;border-radius:12px;padding:10px 12px;font-size:13px}
.bonusbox .br{display:flex;justify-content:space-between;padding:2px 0}

/* area ranking columns */
.acol{border-radius:16px;overflow:hidden;border:2px solid var(--ac);background:#fff}
.acol .h{background:var(--acL);padding:12px 14px}
.acol .h b{font-family:'Jua';font-weight:400;font-size:21px;color:var(--ac)}
.acol .h div{font-size:12px;color:var(--ink2)}
.acol .it{display:grid;grid-template-columns:26px 1fr auto 28px;gap:6px;align-items:center;padding:6px 12px;font-size:13.5px;border-bottom:1px solid #f1ece0;cursor:pointer}
.acol .it:hover{background:#fffbea}
.acol .it .v{font-weight:700;font-variant-numeric:tabular-nums}
.acol .gsep{background:#faf6ec;font-size:11px;color:var(--ink2);padding:3px 12px;font-weight:700;border-bottom:1px solid #f1ece0;display:flex;justify-content:space-between}

/* report card modal */
.il-mask{position:fixed!important;inset:0!important;background:rgba(20,22,30,.55)!important;z-index:99990!important;display:flex!important;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 14px}
.il-modal{background:#fff;border-radius:16px;max-width:620px;width:100%;position:relative;z-index:99991;box-shadow:0 30px 60px rgba(0,0,0,.3);overflow:hidden}
.il-modal .x{position:absolute;right:12px;top:10px;border:none;background:none;font-size:26px;color:#999;z-index:2}
.rc-h{background:#f3efe4;border-bottom:2px solid #2a2d38;padding:18px 22px 14px;text-align:center}
.rc-h .t1{font-size:12.5px;color:var(--ink2);letter-spacing:.05em}
.rc-h .t2{font-family:'Jua';font-size:25px;margin-top:2px}
.rc-info{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1.5px solid #2a2d38;font-size:13px}
.rc-info div{padding:8px 10px;border-right:1px solid var(--line);text-align:center}
.rc-info div:last-child{border-right:none}
.rc-info small{display:block;color:var(--ink3);font-size:11px}
.rc-info b{font-size:15px}
.rc-tbl th{background:#faf6ec;font-size:12.5px;padding:8px;border-bottom:1.5px solid #2a2d38;color:var(--ink2)}
.rc-tbl td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rc-tbl td.ar{font-family:'Jua';font-size:17px;color:var(--ac);text-align:left;padding-left:16px}
.rc-tbl td.ar small{display:block;font-family:'Noto Sans KR';font-size:11px;color:var(--ink3)}
.rc-tbl .gbig{font-family:'Jua';font-size:24px;color:var(--ac)}
.rc-sum{display:flex;gap:10px;padding:16px 20px;align-items:center;flex-wrap:wrap}
.rc-sum .box{flex:1;min-width:120px;background:#faf6ec;border-radius:12px;padding:10px 12px;text-align:center}
.rc-sum .box small{display:block;font-size:11.5px;color:var(--ink2)}
.rc-sum .box b{font-family:'Jua';font-weight:400;font-size:26px}
.rc-sum{position:relative}
.rc-h{position:relative}
.rc-stamp{position:absolute;left:24px;top:10px;width:86px;height:86px;border:3px solid var(--red);border-radius:50%;color:var(--red);font-family:'Jua';display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.1;transform:rotate(-14deg);opacity:.75;pointer-events:none}
.rc-foot{font-size:11.5px;color:var(--ink3);padding:0 20px 16px;text-align:center}


/* 실적 등록 */
.recform{border-top:6px solid var(--pink)}
.recform.is-edit{border-top-color:#7b3fd1;background:#fbf8ff}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg button{border:2px solid var(--rc);background:#fff;color:var(--rc);border-radius:12px;padding:7px 16px;font-family:'Jua';font-size:17px}
.seg button.on{background:var(--rc);color:#fff}
.editing-flag{margin-left:auto;font-weight:900;color:#7b3fd1}
.fgrid{display:grid;grid-template-columns:150px 170px repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.fgrid label{font-size:12px;color:var(--ink2);font-weight:700;display:flex;flex-direction:column;gap:3px}
.fgrid label.wide{grid-column:1/-1}
.fgrid label.chk{flex-direction:row;align-items:center;gap:6px;padding-bottom:8px}
.rtype{display:inline-block;background:var(--rcl);color:var(--rc);font-weight:900;font-size:12px;padding:2px 9px;border-radius:9px;white-space:nowrap}
.rec-tbl td{font-size:13px;vertical-align:middle}
.rec-tbl tr.no td{color:var(--ink3)}
.rec-tbl tr.editing td{background:#f3ecff}
.okb{background:#ddf3e4;color:#1d7a44;font-size:11.5px;font-weight:900;padding:1px 8px;border-radius:8px}
.nob{background:#eee;color:#888;font-size:11.5px;font-weight:900;padding:1px 8px;border-radius:8px}
.sum-tbl td{font-size:13px;text-align:right}.sum-tbl td:last-child{display:flex;gap:8px;align-items:center;justify-content:flex-end}.sum-tbl td:first-child{text-align:left}
.call-tbl td{font-size:12.5px}.call-tbl th{font-size:11.5px}
.rc-recs{padding:0 20px 14px}
.rc-recs table td{font-size:12.5px;padding:5px 6px;border-bottom:1px solid var(--line)}

/* rules */
.rules h3{font-family:'Jua';font-weight:400;font-size:21px;margin:0 0 8px}
.rules p,.rules li{font-size:14px;color:var(--ink)}
.rules ul{padding-left:18px;margin:6px 0}
.rules .tbl td,.rules .tbl th{text-align:center}
.rules .note2{font-size:12.5px;color:var(--ink2);margin-top:8px}

/* admin */
.btn{border:1.5px solid #2a2d38;background:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink)}
.btn:hover{background:#fff7dc}
.btn.pri{background:#2a2d38;color:#fff}.btn.pri:hover{background:#40455a}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.danger{border-color:#d33;color:#d33}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subnav button{border:1.5px solid #2a2d38;background:#fff;border-radius:20px;padding:6px 14px;font-weight:700;font-size:13.5px}
.subnav button.on{background:#2a2d38;color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.inp{width:100%;min-width:70px;border:1.5px solid #ddd5c2;border-radius:8px;padding:6px 8px;text-align:right;background:#fff;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:#2a2d38;background:#fffbea}
.inp.dirty{border-color:var(--pink);background:#fff0f5}
.inp.l{text-align:left}
.adm-tbl th{font-size:12px;color:var(--ink2);padding:8px 6px;border-bottom:2px solid #2a2d38;text-align:center;white-space:nowrap}
.adm-tbl td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.adm-tbl tr.th td{background:#f3efe4;font-family:'Jua';font-size:16px;padding:7px 10px}
.adm-tbl .nmc{font-weight:700}
.adm-tbl .nmc small{color:var(--ink3);font-weight:500;margin-left:4px}
.adm-tbl .pv{font-size:12px;color:var(--ink2);text-align:center}
.login{max-width:380px;margin:30px auto;text-align:center}
.login input{width:100%;padding:12px;border:2px solid #2a2d38;border-radius:10px;font-size:18px;text-align:center;letter-spacing:.3em;margin:14px 0 10px;-webkit-text-security:disc}
.err{color:#d33;font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#2a2d38;color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:99999;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.switch input{width:18px;height:18px}
.log{max-height:520px;overflow:auto}
.log .e{padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px}
.log .e b{font-size:12.5px;color:var(--ink2)}
.log .e ul{margin:4px 0 0;padding-left:18px;color:var(--ink)}
.help{font-size:12.5px;color:var(--ink2);background:#f7f2e5;border-radius:10px;padding:10px 12px;margin-bottom:12px}
textarea.paste{width:100%;min-height:200px;border:1.5px solid #ddd5c2;border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.ver{font-size:11px;color:var(--ink3);text-align:center;margin-top:40px}
.empty{color:var(--ink3);text-align:center;padding:30px;font-family:'Gaegu';font-size:20px}
</style>
</head>

/* ---------- normalize (Firebase drops empty arrays/objects) ---------- */
function arr(x){ if(!x) return []; return Array.isArray(x)? x.filter(Boolean) : Object.values(x); }
function normalize(s){
  const d = defaultState();
  if(!s || typeof s!=='object') return d;
  const o = {
    meta: Object.assign({}, d.meta, s.meta||{}),
    teams: arr(s.teams).length? arr(s.teams) : d.teams,
    members: arr(s.members).length? arr(s.members) : d.members,
    records: arr(s.records), calls: s.calls||{}, teamBonus: s.teamBonus||{},
    revealBlind: !!s.revealBlind, finalAnnounce: !!s.finalAnnounce,
    snaps: s.snaps||{}, log: arr(s.log)
  };
  o.members.forEach(m=>{ m.pos=m.pos||''; delete m.rank; m.dept=m.dept||''; });
  o.records.forEach(r=>{ r.amt=+r.amt||0; r.company=r.company||''; r.media=r.media||''; r.memo=r.memo||''; r.dormant=!!r.dormant; });
  Object.keys(o.calls).forEach(d=>{ const v=o.calls[d]||{}; Object.keys(v).forEach(k=>v[k]=+v[k]||0); });
  o.teams.forEach((t,i)=>{ t.color=t.color||TEAM_COLORS[i%TEAM_COLORS.length]; const b=o.teamBonus[t.id]||{}; o.teamBonus[t.id]={ppt:+b.ppt||0, blog:+b.blog||0}; });
  o.log.forEach(e=>{ e.items = arr(e.items); });
  return o;
}

/* ---------- storage ---------- */
let S = normalize(JSON.parse(localStorage.getItem(LS_KEY)||'null'));
let fb = null, fbState = 'local';
function initFirebase(){
  if(!FIREBASE_CONFIG){ fbState='local'; return; }
  if(typeof firebase==='undefined'){ fbState='off'; return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fb = firebase.database().ref(DB_PATH);
    fbState='connecting';
    fb.on('value', snap=>{
      const v = snap.val();
      const wasLive = fbState==='live';
      fbState='live';
      const next = v? normalize(v) : (wasLive? S : defaultState());
      const js = JSON.stringify(next);
      if(wasLive && js===JSON.stringify(S)){ renderHeader(); return; } // 내가 저장한 값이 되돌아온 경우 → 입력 중인 화면 유지
      S = next; localStorage.setItem(LS_KEY, js);
      render();
    }, err=>{ fbState='off'; console.error(err); render(); });
  }catch(e){ console.error(e); fbState='off'; }
}
function persist(){
  S.meta.updatedAt = new Date().toISOString();
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  if(fb){ return fb.set(JSON.parse(JSON.stringify(S))).then(()=>toast('저장 완료 · 모든 사원 화면에 반영됐어요')).catch(e=>{toast('⚠ 서버 저장 실패: '+e.message);}); }
  toast('저장 완료 (로컬 모드)');
  return Promise.resolve();
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const nf = n=>Number(n||0).toLocaleString('ko-KR');
function won(v){ v=+v||0; if(v>=1e8){ return (Math.round(v/1e6)/100).toLocaleString('ko-KR')+'억'; } return nf(Math.round(v/10000))+'만'; }
function fmtVal(k,v){ if(k==='rev') return won(v)+'원'; if(k==='call') return nf(Math.round(v*10)/10)+'분'; return nf(v)+'건'; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- 실적 집계 (일별 기록 → 누적) ---------- */
const REC_TYPES = {
  xfer:{label:'이관', icon:'📖', c:'var(--pink)', cl:'var(--pinkL)', hint:'이관 매출은 금액 전부 합산, 이관 건수는 10만 원 이상만 인정'},
  live:{label:'기타매체 라이브', icon:'🔍', c:'var(--yel)', cl:'var(--yelL)', hint:'10만 원 이상 라이브만 인정 (금액을 비워두면 인정으로 처리) · 3개월 휴면계정 포함'},
  check:{label:'성과조회', icon:'⭐', c:'#7b3fd1', cl:'#efe6fb', hint:'100만 원 이상 성과조회 건당 5점 (금액을 비워두면 인정으로 처리)'},
};
const MEDIA = ['GFA','11번가','구글_MR','모먼트','크리테오','TG','메타','모비온'];
function inPeriod(d){ return d>=S.meta.start && d<=S.meta.end; }
function recOk(r){
  if(!inPeriod(r.date)) return false;
  if(r.type==='xfer') return r.amt>=100000;
  if(r.type==='live') return !r.amt || r.amt>=100000;
  if(r.type==='check') return !r.amt || r.amt>=1000000;
  return false;
}
function derivePerf(){
  const P={}; S.members.forEach(m=>P[m.id]={cnt:0,rev:0,call:0,live:0,check:0});
  S.records.forEach(r=>{ const p=P[r.mid]; if(!p || !inPeriod(r.date)) return;
    if(r.type==='xfer'){ p.rev+=r.amt; if(r.amt>=100000) p.cnt++; }
    else if(r.type==='live'){ if(recOk(r)) p.live++; }
    else if(r.type==='check'){ if(recOk(r)) p.check++; } });
  Object.entries(S.calls).forEach(([d,v])=>{ if(!inPeriod(d)) return; Object.entries(v||{}).forEach(([id,min])=>{ if(P[id]) P[id].call+=min; }); });
  Object.values(P).forEach(p=>p.call=Math.round(p.call*10)/10);
  return P;
}

/* ---------- core scoring ---------- */
function gradeBounds(N){
  let cum=0; return GRADE_QUOTA.map(q=>{ cum+=q; return Math.round(cum*N/24); });
}
function compute(){
  const P = derivePerf();
  const ms = S.members.map(m=>({...m, p:P[m.id], areas:{}}));
  const N = ms.length, bounds = gradeBounds(N);
  const gradeOfPos = pos=>{ for(let i=0;i<5;i++) if(pos<=bounds[i]) return i+1; return 5; };
  AREAS.forEach(a=>{
    const sorted = [...ms].sort((x,y)=>y.p[a.k]-x.p[a.k] || x.name.localeCompare(y.name,'ko'));
    let i=0;
    while(i<sorted.length){
      let j=i; while(j+1<sorted.length && sorted[j+1].p[a.k]===sorted[i].p[a.k]) j++;
      const g = gradeOfPos(j+1); // 동점 → 걸친 등급 중 아래 등급
      for(let t=i;t<=j;t++) sorted[t].areas[a.k] = {v:sorted[t].p[a.k], rank:i+1, grade:g, score:GRADE_SCORE[g-1], tie:j>i, tieN:j-i+1};
      i=j+1;
    }
  });
  ms.forEach(m=>{ m.base=AREAS.reduce((s,a)=>s+m.areas[a.k].score,0); m.extra=m.p.check*CHECK_PT; m.total=m.base+m.extra; });
  const byTotal=[...ms].sort((a,b)=>b.total-a.total || b.p.rev-a.p.rev || a.name.localeCompare(b.name,'ko'));
  byTotal.forEach((m,i)=>{ m.rank = (i>0 && byTotal[i-1].total===m.total)? byTotal[i-1].rank : i+1; });

  const teams = S.teams.map(t=>{
    const mem = ms.filter(m=>m.team===t.id).sort((a,b)=>b.total-a.total || b.p.rev-a.p.rev);
    const b = S.teamBonus[t.id]||{ppt:0,blog:0};
    const rev = mem.reduce((s,m)=>s+m.p.rev,0);
    const baseSum = mem.reduce((s,m)=>s+m.base,0), extraSum = mem.reduce((s,m)=>s+m.extra,0);
    const revBonus = Math.floor(rev/REV_STEP)*REV_STEP_PT;
    const blind = b.ppt*PPT_PT + b.blog*BLOG_PT;
    const open = baseSum+extraSum+revBonus;
    return {...t, mem, rev, baseSum, extraSum, revBonus, ppt:b.ppt, blog:b.blog, blind, open, full:open+blind,
      visible: open + (S.revealBlind? blind:0), toNext: REV_STEP - (rev%REV_STEP)};
  });
  const rankTeams = key=>{ const s=[...teams].sort((a,b)=>b[key]-a[key] || b.rev-a.rev); s.forEach((t,i)=>t[key+'Rank']=i+1); return s; };
  const pub = rankTeams('visible'), adm = rankTeams('full');
  return {ms, byTotal, teams, pub, adm, N, bounds};
}

/* ---------- rank change (vs 직전 업데이트일) ---------- */
function recordSnapshot(C){
  const d = todayStr(); const m={}, t={};
  C.ms.forEach(x=>m[x.id]=x.rank); C.pub.forEach(x=>t[x.id]=x.visibleRank);
  S.snaps[d] = {m,t};
  const keys = Object.keys(S.snaps).sort(); while(keys.length>40){ delete S.snaps[keys.shift()]; }
}
function baseSnap(){
  const keys = Object.keys(S.snaps).sort().reverse();
  return keys[1]? S.snaps[keys[1]] : null;
}
function chg(prev, cur){
  if(prev==null) return '<span class="ch eq">-</span>';
  const d = prev-cur;
  if(d>0) return `<span class="ch up">▲${d}</span>`;
  if(d<0) return `<span class="ch dn">▼${-d}</span>`;
  return '<span class="ch eq">-</span>';
}

function readForm(){

}
function saveRec(){
  const f=readForm();
  const err = !f.date? '날짜를 선택해주세요' : !f.mid? '참가자를 선택해주세요' : (f.type==='xfer' && !f.amt)? '이관 매출 금액을 입력해주세요' : (f.type==='live' && !f.media)? '매체를 선택해주세요' : '';
  if(err){ $('#fErr').textContent=err; return; }
  if(!inPeriod(f.date) && !confirm('프로모션 기간 밖의 날짜예요. 그래도 등록할까요? (점수에는 반영되지 않아요)')) return;
  const RT=REC_TYPES[f.type];
  const desc = r=>`${fmtD(r.date)} ${r.type==='live'?r.media+' ':''}${r.company||''} ${r.amt?nf(r.amt)+'원':''}`.trim();
  if(recEdit){
    const r=S.records.find(x=>x.id===recEdit); const before=desc(r)+' / '+memName(r.mid);
    Object.assign(r,f);
    addLog('실적 수정',[{n:memName(r.mid),f:RT.label,a:before,b:desc(r)}]);
    recEdit=null; toast('수정했어요');
  } else {
    const r={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), at:new Date().toISOString(), ...f};
    S.records.push(r);
    addLog('실적 등록',[{n:memName(r.mid),f:RT.label,a:'',b:desc(r)}]);
  }
  recForm.date=f.date; recForm.mid=f.mid;
  recordSnapshot(compute()); persist(); render();
  setTimeout(()=>$('#fCompany')?.focus(),50);
}

function addLog(title, items){
  S.log.unshift({at:new Date().toISOString(), title, items:items||[]});
  if(S.log.length>300) S.log.length=300;
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; sc.onload=()=>res(window.XLSX); sc.onerror=()=>rej(new Error('엑셀 읽기 도구를 불러오지 못했어요 (인터넷 연결 확인)')); document.head.appendChild(sc); });
}
function normDate(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  const m=String(v||'').trim().match(/(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  const m2=String(v||'').trim().match(/^(\d{1,2})[.\-\/월\s]+(\d{1,2})/); // 11/02 형태
  if(m2) return S.meta.start.slice(0,4)+'-'+m2[1].padStart(2,'0')+'-'+m2[2].padStart(2,'0');
  return '';
}
function parseCallWorkbook(XLSX, data){
  const wb = XLSX.read(data,{type:'array',cellDates:true});
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    for(let h=0; h<Math.min(rows.length,10); h++){
      const hd=rows[h].map(x=>String(x).replace(/\s/g,''));
      const iN=hd.findIndex(x=>/사원명|이름|성명|상담원/.test(x)), iD=hd.findIndex(x=>/날짜|일자/.test(x)), iM=hd.findIndex(x=>/통화시간|통화|분/.test(x) && !/날짜/.test(x));
      if(iN>=0 && iD>=0 && iM>=0){
        const out=[]; rows.slice(h+1).forEach(r=>{ const n=String(r[iN]||'').trim(); const d=normDate(r[iD]); const mm=parseFloat(String(r[iM]).replace(/[^0-9.\-]/g,'')); if(n && d && isFinite(mm)) out.push({n,d,m:mm}); });
        return {sheet:sn, rows:out};
      }
    }
  }
  throw new Error('「사원명 · 날짜 · 통화시간(분)」 열이 있는 시트를 찾지 못했어요');
}
function findMember(name){ const n=String(name).replace(/\s+/g,'').replace(/(인턴|사원|주임|대리|과장|차장|부장|팀장)$/,''); return S.members.find(m=>m.name===n); }
let callPreview=null;
function buildCallPreview(parsed, fileName){
  const by={}, unmatched=new Set(), dates=new Set();
  parsed.rows.forEach(r=>{ const m=findMember(r.n); dates.add(r.d); if(!m){ unmatched.add(r.n); return; } by[r.d]=by[r.d]||{}; by[r.d][m.id]=Math.round(((by[r.d][m.id]||0)+r.m)*10)/10; });
  const ds=[...dates].sort();
  const seen=new Set(); Object.values(by).forEach(v=>Object.keys(v).forEach(k=>seen.add(k)));
  const missing=S.members.filter(m=>!seen.has(m.id)).map(m=>m.name);
  return {fileName, sheet:parsed.sheet, by, dates:ds, unmatched:[...unmatched], missing, total:parsed.rows.length};
}

function saveRoster(){
  const R=rosterDraft;
  const names=R.members.map(m=>m.name.trim());
  if(names.some(n=>!n)) return alert('이름이 비어 있는 행이 있어요.');
  const dup=names.filter((n,i)=>names.indexOf(n)!==i); if(dup.length) return alert('이름이 중복돼요: '+[...new Set(dup)].join(', ')+'\n(동명이인은 "김지현B"처럼 구분해주세요)');
  R.teams.forEach(t=>{ if(t.leaderId && !R.members.some(m=>m.id===t.leaderId && m.team===t.id)) t.leaderId=''; });
  const items=[];
  const oldMap=Object.fromEntries(S.members.map(m=>[m.id,m]));
  R.members.forEach(m=>{ m.name=m.name.trim(); const o=oldMap[m.id];
    if(!o) items.push({n:m.name,f:'인원 추가',a:'',b:(R.teams.find(t=>t.id===m.team)||{}).name||'미배정'});
    else if(o.team!==m.team) items.push({n:m.name,f:'조 이동',a:(teamOf(o.team)||{}).name||'미배정',b:(R.teams.find(t=>t.id===m.team)||{}).name||'미배정'});
    else if(o.name!==m.name) items.push({n:o.name,f:'이름 변경',a:o.name,b:m.name});
  });
  S.members.forEach(o=>{ if(!R.members.some(m=>m.id===o.id)){ items.push({n:o.name,f:'인원 삭제',a:'',b:''}); S.records=S.records.filter(r=>r.mid!==o.id); Object.values(S.calls).forEach(v=>{ if(v) delete v[o.id]; }); } });
  R.teams.forEach(t=>{ const o=teamOf(t.id); if(o && o.leaderId!==t.leaderId){ const nm=(R.members.find(m=>m.id===t.leaderId)||{}).name||'미지정'; items.push({n:t.name,f:'조장 변경',a:leaderName(o),b:nm}); } });
  S.teams=R.teams; S.members=R.members;
  addLog('조 편성 변경', items.length? items : [{n:'-',f:'팀 정보 수정',a:'',b:''}]);
  rosterDraft=null; draft=null; persist(); render();
}

  lines.push(['순위','이름','직급','소속','팀',...AREAS.flatMap(a=>[a.sub,a.sub+' 등급',a.sub+' 점수']),'기본점수','성과조회','추가점수','총점'].join(','));
  C.byTotal.forEach(m=>lines.push([m.rank,m.name,m.pos,m.dept,(teamOf(m.team)||{}).name||'',...AREAS.flatMap(a=>[m.areas[a.k].v,m.areas[a.k].grade,m.areas[a.k].score]),m.base,m.p.check,m.extra,m.total].join(',')));
  download(`일타강사_결과_${todayStr()}.csv`, '﻿'+lines.join('\n'), 'text/csv;charset=utf-8');
}

/* ================= RENDER & EVENTS ================= */
function render(){
  renderHeader();
  const C = compute();
  let html='';
  if(view==='home') html=vHome(C); else if(view==='teams') html=vTeams(C); else if(view==='areas') html=vAreas(C); else if(view==='people') html=vPeople(C); else if(view==='rules') html=vRules(); else html=vAdmin(C);
  const prev={}; if(view==='home' && lastView==='home') document.querySelectorAll('.pod[data-team]').forEach(el=>prev[el.dataset.team]=el.getBoundingClientRect());
  $('#main').innerHTML = html;
  if(view==='home') document.querySelectorAll('.pod[data-team]').forEach(el=>{ const a=prev[el.dataset.team]; if(!a) return; const b=el.getBoundingClientRect(); const dx=a.left-b.left, dy=a.top-b.top;
    if(Math.abs(dx)>2||Math.abs(dy)>2) el.animate([{transform:`translate(${dx}px,${dy}px)`,zIndex:5},{transform:'translate(0,0)'}],{duration:1100,easing:'cubic-bezier(.2,.9,.25,1)'}); });
  lastView=view;
  bind();
}
function bind(){
  document.querySelectorAll('[data-mid]').forEach(el=>el.onclick=()=>openReport(el.dataset.mid));
  document.querySelectorAll('.pod[data-team]').forEach(el=>el.onclick=()=>{ view='teams'; render(); setTimeout(()=>document.getElementById('team-'+el.dataset.team)?.scrollIntoView({behavior:'smooth',block:'start'}),50); });
  if(view!=='admin') return;
  if(!isAdmin){
    const go=()=>{ if($('#pw').value===ADMIN_PW){ isAdmin=true; sessionStorage.setItem('ilta_admin','1'); render(); } else { $('#pwErr').textContent='비밀번호가 맞지 않아요'; $('#pw').value=''; } };
    $('#pwBtn').onclick=go; $('#pw').onkeydown=e=>{ if(e.key==='Enter') go(); }; $('#pw').focus(); return;
  }
  $('#logout').onclick=()=>{ isAdmin=false; sessionStorage.removeItem('ilta_admin'); draft=null; rosterDraft=null; render(); };
  document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{ admTab=b.dataset.at; recEdit=null; render(); });
  if(admTab==='rec'){
    document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{
      const keep={date:$('#fDate').value, mid:$('#fMid').value, company:$('#fCompany').value, amt:$('#fAmt').value, memo:$('#fMemo').value};
      recForm.type=b.dataset.rt; recForm.date=keep.date; recForm.mid=keep.mid; render();
      $('#fDate').value=keep.date; $('#fMid').value=keep.mid; $('#fCompany').value=keep.company; $('#fAmt').value=keep.amt; $('#fMemo').value=keep.memo; });
    $('#fAmt').onblur=()=>{ const v=parseNum($('#fAmt').value); $('#fAmt').value = v? nf(v):''; };
    $('#fSave').onclick=saveRec;
    document.querySelectorAll('.recform input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); saveRec(); } });
    if($('#fCancel')) $('#fCancel').onclick=()=>{ recEdit=null; render(); };
    document.querySelectorAll('.redit').forEach(b=>b.onclick=()=>{ recEdit=b.dataset.id; const r=S.records.find(x=>x.id===recEdit); recForm.type=r.type; render(); window.scrollTo({top:$('.recform').getBoundingClientRect().top+window.scrollY-20,behavior:'smooth'}); });
    document.querySelectorAll('.rdelr').forEach(b=>b.onclick=()=>{ const r=S.records.find(x=>x.id===b.dataset.id); if(!confirm(`${memName(r.mid)} · ${REC_TYPES[r.type].label} · ${r.company||''} 기록을 삭제할까요?`)) return;
      S.records=S.records.filter(x=>x!==r); if(recEdit===r.id) recEdit=null; addLog('실적 삭제',[{n:memName(r.mid),f:REC_TYPES[r.type].label,a:`${fmtD(r.date)} ${r.company} ${r.amt?nf(r.amt)+'원':''}`,b:'삭제'}]); recordSnapshot(compute()); persist(); render(); });
    $('#flType').onchange=e=>{ recFilter.type=e.target.value; render(); };
    $('#flMid').onchange=e=>{ recFilter.mid=e.target.value; render(); };
    $('#flQ').onchange=e=>{ recFilter.q=e.target.value.trim(); render(); };
  }
  if(admTab==='call'){
    $('#callFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; $('#callErr').textContent='읽는 중…';
      try{ const X=await loadXLSX(); const buf=await f.arrayBuffer(); callPreview=buildCallPreview(parseCallWorkbook(X,buf), f.name); $('#callErr').textContent=''; openCallPreview(); }
      catch(err){ $('#callErr').textContent='⚠ '+err.message; } e.target.value=''; };
    document.querySelectorAll('.cdel').forEach(b=>b.onclick=()=>{ const d=b.dataset.d; if(!confirm(`${fmtD(d)} 콜 데이터를 삭제할까요?`)) return; delete S.calls[d]; addLog('콜 분수 삭제',[{n:'-',f:'날짜',a:fmtD(d),b:'삭제'}]); recordSnapshot(compute()); persist(); render(); });
  }
  if(admTab==='team'){
    $('#saveTB').onclick=()=>{ const items=[]; document.querySelectorAll('input.tb').forEach(inp=>{ const t=inp.dataset.t,k=inp.dataset.k,v=Math.max(0,Math.round(parseNum(inp.value))); if(S.teamBonus[t][k]!==v){ items.push({n:teamOf(t).name,f:k==='ppt'?'PPT 건수':'블로그 건수',a:String(S.teamBonus[t][k]),b:String(v)}); S.teamBonus[t][k]=v; } });
      if(!items.length) return toast('변경된 값이 없어요'); addLog('팀 점수(블라인드) 변경', items); persist(); render(); };
    $('#revealBlind').onchange=e=>{ S.revealBlind=e.target.checked; addLog(S.revealBlind?'블라인드 점수 공개':'블라인드 점수 비공개 전환'); recordSnapshot(compute()); persist(); render(); };
    $('#finalAnnounce').onchange=e=>{ S.finalAnnounce=e.target.checked; addLog(S.finalAnnounce?'최종 결과 발표 모드 ON':'최종 결과 발표 모드 OFF'); persist(); render(); };
  }
  if(admTab==='roster'){
    document.querySelectorAll('.rt').forEach(el=>el.onchange=()=>{ rosterDraft.teams[+el.dataset.i][el.dataset.k]=el.value; if(el.dataset.k!=='name') render(); });
    document.querySelectorAll('.rm').forEach(el=>{ el.onchange=()=>{ rosterDraft.members[+el.dataset.i][el.dataset.k]=el.value; if(el.dataset.k==='team') render(); }; });
    document.querySelectorAll('.rdel').forEach(b=>b.onclick=()=>{ const m=rosterDraft.members[+b.dataset.i]; if(confirm(`${m.name}님을 삭제할까요? (저장 시 실적도 함께 삭제)`)){ rosterDraft.members.splice(+b.dataset.i,1); render(); } });
    $('#rAdd').onclick=()=>{ let n=1; while(rosterDraft.members.some(m=>m.id==='m'+String(n).padStart(2,'0')) || S.members.some(m=>m.id==='m'+String(n).padStart(2,'0'))) n++; rosterDraft.members.push({id:'m'+String(n).padStart(2,'0'),name:'',pos:'',dept:'',team:rosterDraft.teams[0]?.id||''}); render(); };
    $('#rReset').onclick=()=>{ rosterDraft=null; render(); };
    $('#rSave').onclick=saveRoster;
  }
  if(admTab==='data'){
    $('#saveDates').onclick=()=>{ const s=$('#sDate').value,e=$('#eDate').value; if(!s||!e||s>e) return alert('기간을 확인해주세요'); S.meta.start=s; S.meta.end=e; addLog('기간 변경',[{n:'-',f:'기간',a:'',b:s+' ~ '+e}]); persist(); render(); };
    $('#dlJson').onclick=()=>download(`일타강사_백업_${todayStr()}.json`, JSON.stringify(S,null,2), 'application/json');
    $('#dlCsv').onclick=exportCsv;
    $('#upJson').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.members||!o.teams) throw new Error('형식이 달라요'); if(!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return; S=normalize(o); addLog('백업 복원',[{n:'-',f:'파일',a:'',b:f.name}]); draft=null; rosterDraft=null; persist(); render(); }catch(err){ alert('복원 실패: '+err.message); } }; r.readAsText(f); };
    $('#resetPerf').onclick=()=>{ if(prompt('실적을 모두 0으로 만듭니다. 진행하려면 "초기화"라고 입력하세요')!=='초기화') return; S.records=[]; S.calls={}; S.teams.forEach(t=>S.teamBonus[t.id]={ppt:0,blog:0}); S.snaps={}; addLog('실적 초기화'); persist(); render(); };
    $('#resetAll').onclick=()=>{ if(prompt('조 편성까지 처음 상태로 되돌립니다. 진행하려면 "전체초기화"라고 입력하세요')!=='전체초기화') return; S=defaultState(); addLog('전체 초기화'); persist(); render(); };
  }
}

initFirebase();
render();
setInterval(renderHeader, 60000);
</script>
